<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鋳物の島 Foundry Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17323c;
  --panel:rgba(236,242,239,.92);
  --panel-solid:#ecf2ef;
  --ink:#16262c;
  --ink2:#52666d;
  --line:rgba(22,38,44,.16);
  --brass:#b98a22;
  --brass-hi:#e6bb5a;
  --brass-ink:#2a1c04;
  --ok:#3f7b57;
  --bad:#a4452d;
  --verd:#2f7f72;
  --shadow:0 12px 32px rgba(8,22,28,.38);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:rgba(14,30,37,.9);--panel-solid:#0e1e25;--ink:#e8efec;--ink2:#9fb3b8;--line:rgba(232,239,236,.14);
    --brass:#d9a441;--brass-hi:#f0c56a;--ok:#8cc49a;--bad:#e08a6e;--verd:#79c2b1;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(14,30,37,.9);--panel-solid:#0e1e25;--ink:#e8efec;--ink2:#9fb3b8;--line:rgba(232,239,236,.14);
  --brass:#d9a441;--brass-hi:#f0c56a;--ok:#8cc49a;--bad:#e08a6e;--verd:#79c2b1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;font-weight:500;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#cv.pointer{cursor:pointer}
.hidden{display:none!important}
.serif{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#hud>*{pointer-events:auto}
.bank{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px 9px 14px;box-shadow:var(--shadow);min-width:150px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bank .lbl{font-size:11px;color:var(--ink2);letter-spacing:.06em}
.bank .num{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(28px,6.4vw,38px);line-height:1.1;font-variant-numeric:tabular-nums}
.bank .rate{font-size:13px;color:var(--verd);font-weight:700;font-variant-numeric:tabular-nums}
.hudr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:700;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip svg{width:16px;height:16px;flex:none}
.chip.buff{border-color:var(--brass);color:var(--brass-ink);background:linear-gradient(180deg,var(--brass-hi),var(--brass))}
.iconbtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;box-shadow:var(--shadow);padding:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:focus-visible,.chip:focus-visible,.card:focus-visible,.go:focus-visible,.seg button:focus-visible,.mbtn:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* Dock */
#dock{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(10px + 0px);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
#dock>*{pointer-events:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button.chip{cursor:pointer;color:var(--ink)}
button.chip:disabled{opacity:.5;cursor:default}
button.chip:not(:disabled):active{transform:translateY(1px)}
#panel{width:min(780px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;min-height:84px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ph{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px}
.pt{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:17px}
.ps{font-size:12px;color:var(--ink2)}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.card{flex:0 0 auto;width:158px;text-align:left;border:1px solid var(--line);border-radius:9px;background:transparent;padding:9px 10px 9px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.card:not(.locked):not(.poor):hover{border-color:var(--brass);background:rgba(185,138,34,.08)}
.card .cn{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:15px}
.card .cd{font-size:11px;color:var(--ink2);line-height:1.45;min-height:32px}
.card .cr{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.card .cs{color:var(--verd)}
.card .cp{display:inline-flex;gap:5px;align-items:center}
.card.poor .cp{color:var(--bad)}
.card.locked{opacity:.5;cursor:default}
.cc{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2,#e0a93a 55%,#9a6c14);box-shadow:0 0 0 1px rgba(90,60,10,.4);display:inline-block;flex:none}
.bwrap{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.bn{display:flex;align-items:center;gap:9px;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:18px}
.lvb{font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;background:var(--ink);color:var(--panel-solid);border-radius:5px;padding:2px 7px;font-weight:700}
.bd{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.bst{display:flex;gap:18px;margin-bottom:8px}
.bst div{display:flex;flex-direction:column;line-height:1.2}
.bst b{font-size:16px;font-variant-numeric:tabular-nums}
.bst small{font-size:11px;color:var(--ink2)}
.ms{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:260px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.mt{font-size:11px;color:var(--ink2);white-space:nowrap}
.br{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:176px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:6px 0;font-size:12px;font-weight:700;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--panel-solid)}
.go{border:1px solid #8a6414;border-radius:9px;background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);font-weight:800;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 rgba(90,60,10,.35);font-size:14px}
.go .gc{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-size:13px}
.go:disabled{opacity:.42;cursor:default;box-shadow:none}
.go:not(:disabled):active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.tip{font-size:13px;color:var(--ink2);line-height:1.7}
.tip b{color:var(--ink)}

/* Toast / modal */
#toast{position:absolute;left:50%;top:calc(88px);transform:translate(-50%,-6px);background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:min(92vw,520px);text-align:center;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:absolute;inset:0;background:rgba(6,16,20,.55);display:grid;place-items:center;padding:16px;z-index:8}
#modal .mc{width:min(420px,100%);background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
#modal h2{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:21px;margin:0 0 10px}
#modal p{font-size:14px;line-height:1.75;margin:0 0 14px;color:var(--ink)}
#modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px}
.mbtn.pri{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:#8a6414}
.mbtn.dng{color:var(--bad);border-color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px;margin:0 0 14px}
.kv span:nth-child(even){font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* Splash */
#splash{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:radial-gradient(120% 90% at 50% 38%,#2c6072 0%,#17323c 55%,#0d1d24 100%);color:#e8efec;transition:opacity .9s ease,visibility .9s}
#splash.out{opacity:0;visibility:hidden}
#splash h1{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(40px,11vw,76px);margin:0;letter-spacing:.04em;line-height:1.05}
#splash .sub{font-size:clamp(13px,3.4vw,16px);line-height:1.9;color:#a9c0c5;max-width:30em}
#splash .go{padding:12px 34px;font-size:16px;border-radius:10px}
#splash .alt{background:none;border:0;color:#a9c0c5;font-size:12px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){
  .bwrap{grid-template-columns:1fr}
  .br{flex-direction:row;align-items:center;min-width:0}
  .br .seg{flex:0 0 132px}.br .go{flex:1}
  .card{width:146px}
  #hud{padding:10px}
}
@media (prefers-reduced-motion: reduce){#toast,#splash{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="bank">
      <div class="lbl">資金</div>
      <div class="num" id="coins">0</div>
      <div class="rate" id="ips">+0/秒</div>
    </div>
    <div class="hudr">
      <div class="chip buff hidden" id="buff"></div>
      <div class="chip hidden" id="gearchip" title="歯車:すべての生産が+8%ずつ上がる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        <span id="gears">0</span>
      </div>
      <button class="iconbtn" id="btnMenu" aria-label="メニュー">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="dock">
    <div class="chips">
      <button class="chip" id="btnView"></button>
      <button class="chip" id="btnExpand"></button>
      <button class="chip hidden" id="btnReforge"></button>
    </div>
    <div id="panel"></div>
  </div>

  <div id="modal" class="hidden"><div class="mc" id="mc"></div></div>

  <div id="splash">
    <h1>鋳物の島</h1>
    <div class="sub">小さな工房がひとつ。<br>やがて島は煙突の森になり、空には荷運びの飛行機が行き交う。</div>
    <button class="go" id="btnStart">島へ向かう</button>
    <button class="alt hidden" id="btnFresh">最初からはじめる</button>
  </div>
</div>

<script>
(()=>{
'use strict';

/* ================= 定数・ユーティリティ ================= */
const TW=128, TH=64, MAXR=4;
let ZU=72;
const SAVE_KEY='foundryIsle.v1';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(x,y,s){s=s||0;let h=(x*374761393+y*668265263+s*1274126177)|0;h=(h^(h>>>13))*1274126177|0;h^=h>>>16;return (h>>>0)/4294967295;}
const UNITS=['','万','億','兆','京','垓','秭','穣','溝','澗','正'];
function fmt(v,rate){
  if(!isFinite(v)) return '∞';
  if(v<0) v=0;
  if(v<1e4){
    if(rate&&v<100) return v.toFixed(v<10?2:1);
    return Math.floor(v).toLocaleString('ja-JP');
  }
  let e=Math.floor(Math.log10(v)/4);
  e=Math.min(e,UNITS.length-1);
  let m=v/Math.pow(10,e*4);
  const f=x=>{const r=parseFloat(x.toFixed(2));return String(r>=100?Math.round(x):r>=10?parseFloat(x.toFixed(1)):r);};
  let s=f(m);
  if(parseFloat(s)>=10000&&e<UNITS.length-1){e++;m=v/Math.pow(10,e*4);s=f(m);}
  if(m>=1e4) return v.toExponential(2);
  return s+UNITS[e];
}
const cache=new Map();
function sh(hex,k){
  const key=hex+k;let v=cache.get(key);if(v)return v;
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=k<0?[34,28,40]:[255,244,218],a=Math.abs(k);
  r=Math.round(r+(t[0]-r)*a);g=Math.round(g+(t[1]-g)*a);b=Math.round(b+(t[2]-b)*a);
  v='rgb('+r+','+g+','+b+')';cache.set(key,v);return v;
}

/* ================= ゲームデータ ================= */
const TYPES=[
  {id:'workshop',name:'工房',desc:'職人が小物を打ち出す、島のはじまり。',cost:12,inc:1,T:2,g:1.15},
  {id:'mill',name:'風車製粉所',desc:'潮風で石臼を回し、粉を挽く。',cost:130,inc:10,T:3,g:1.15},
  {id:'foundry',name:'鋳造所',desc:'炉に火が入り、鉄が型へ流れ込む。',cost:1500,inc:95,T:4,g:1.15},
  {id:'refinery',name:'精錬塔',desc:'煙突の先で余剰ガスが燃え続ける。',cost:20000,inc:1250,T:5,g:1.15},
  {id:'engine',name:'蒸気機関館',desc:'真鍮のドームの下で巨大な弾み車が回る。',cost:300000,inc:19000,T:6,g:1.15},
  {id:'core',name:'エーテル炉',desc:'島でいちばん明るい場所。理屈はだれも知らない。',cost:5e6,inc:330000,T:8,g:1.15}
];
const BASEH=[.78,1.0,1.18,1.45,1.0,1.35];
const MS=[10,25,50,100,150,200,300,400,500];
const EXPAND_COST={3:6000,4:900000};
const REFORGE_MIN=5e6;

function defaultState(){return {coins:15,run:0,total:0,gears:0,rad:2,unl:0,b:[],buffT:0,taps:0,deliv:0,sound:true,low:false,t:Date.now()};}
let S=defaultState();
const DEPOT={gx:0,gy:0,pulse:0,lv:1,depot:true};

const tierOf=lv=>{let n=0;for(const m of MS)if(lv>=m)n++;return n;};
const multOf=lv=>Math.pow(2,tierOf(lv));
const gm=()=>(1+.08*S.gears)*(S.buffT>0?3:1);
const cycleAmt=b=>TYPES[b.type].inc*b.lv*multOf(b.lv)*gm();
const rateOf=b=>cycleAmt(b)/TYPES[b.type].T;
const ips=()=>{let a=0;for(const b of S.b)a+=rateOf(b);return a;};
const upCost=(b,n)=>{const T=TYPES[b.type],g=T.g;return T.cost*Math.pow(g,b.lv)*(Math.pow(g,n)-1)/(g-1);};
function maxBuy(b){
  const T=TYPES[b.type],g=T.g;const base=T.cost*Math.pow(g,b.lv);
  const n=Math.floor(Math.log(1+S.coins*(g-1)/base)/Math.log(g));
  return clamp(isFinite(n)?n:0,0,500);
}
const countOf=i=>S.b.filter(b=>b.type===i).length;
const placeCost=i=>TYPES[i].cost*Math.pow(1.5,countOf(i));
const bAt=(gx,gy)=>S.b.find(b=>b.gx===gx&&b.gy===gy);
const isLand=(gx,gy)=>Math.max(Math.abs(gx),Math.abs(gy))<=S.rad;
const reforgeGain=()=>Math.floor(Math.sqrt(S.run/REFORGE_MIN));
function hk(b){const s=1+Math.min(b.lv,150)/150*.7;return s*(1+(b.pulse||0)*.1);}
const bh=b=>b.depot?1.0:BASEH[b.type]*hk(b);

/* ================= キャンバス ================= */
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,dockH=150;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  const r=cv.getBoundingClientRect();W=r.width||innerWidth;H=r.height||innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  dockH=$('#dock').offsetHeight||150;
}
window.addEventListener('resize',resize);
if(window.ResizeObserver){new ResizeObserver(()=>{dockH=$('#dock').offsetHeight||150;}).observe($('#dock'));}

let camScale=1,userZoom=1,panX=0,panY=0,shake=0,gt=0,expandT=1;
function targetScale(){
  const r=S.rad;const ww=(2*r+1)*TW+50,hh=(2*r+1)*TH+215;
  return clamp(Math.min(W/ww,(H-dockH-84)/hh),.26,1.3);
}
function cam(){
  const s=camScale*userZoom;
  const cy=84+(H-dockH-84)/2;
  return {s:s,ox:W/2+panX,oy:cy+26*s+panY};
}

/* ================= 描画ヘルパー ================= */
const px=(x,y,z)=>[(x-y)*TW/2,(x+y)*TH/2-(z||0)*ZU];
function poly(pts,fill,stroke,lw){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){if(i)ctx.lineTo(pts[i][0],pts[i][1]);else ctx.moveTo(pts[i][0],pts[i][1]);}
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}
function fillV(pts,c0,c1){
  let a=1e9,b=-1e9;for(const p of pts){if(p[1]<a)a=p[1];if(p[1]>b)b=p[1];}
  const g=ctx.createLinearGradient(0,a,0,b);g.addColorStop(0,c0);g.addColorStop(1,c1);poly(pts,g);
}
function box(cx,cy,w,d,z0,h,col,o){
  o=o||{};
  const x0=cx-w/2,x1=cx+w/2,y0=cy-d/2,y1=cy+d/2,z1=z0+h;
  const Lq=[px(x0,y1,z1),px(x1,y1,z1),px(x1,y1,z0),px(x0,y1,z0)];
  const Rq=[px(x1,y0,z1),px(x1,y1,z1),px(x1,y1,z0),px(x1,y0,z0)];
  const Tq=[px(x0,y0,z1),px(x1,y0,z1),px(x1,y1,z1),px(x0,y1,z1)];
  fillV(Lq,sh(col,.05),sh(col,-.17));
  fillV(Rq,sh(col,-.25),sh(col,-.42));
  if(!o.notop)poly(Tq,sh(col,.2));
  ctx.strokeStyle='rgba(255,246,220,.24)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(Lq[0][0],Lq[0][1]);ctx.lineTo(Lq[1][0],Lq[1][1]);ctx.lineTo(Rq[0][0],Rq[0][1]);ctx.stroke();
  ctx.strokeStyle='rgba(20,14,20,.16)';ctx.beginPath();ctx.moveTo(Lq[1][0],Lq[1][1]);ctx.lineTo(Lq[2][0],Lq[2][1]);ctx.stroke();
  return {
    x0:x0,x1:x1,y0:y0,y1:y1,z0:z0,z1:z1,w:w,d:d,h:h,
    L:(u,v)=>px(x0+u*w,y1,z0+v*h),
    R:(u,v)=>px(x1,y0+u*d,z0+v*h),
    T:(u,v)=>px(x0+u*w,y0+v*d,z1)
  };
}
function win(B,f,u0,v0,u1,v1,lit,arch){
  const q=[B[f](u0,v1),B[f](u1,v1),B[f](u1,v0),B[f](u0,v0)];
  if(lit)fillV(q,'#ffe3a2','#e49b3c');else fillV(q,'#7391a0','#2d414c');
  ctx.strokeStyle='rgba(30,22,16,.55)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);ctx.lineTo(q[1][0],q[1][1]);ctx.lineTo(q[2][0],q[2][1]);ctx.lineTo(q[3][0],q[3][1]);ctx.closePath();ctx.stroke();
  const m0=B[f]((u0+u1)/2,v1),m1=B[f]((u0+u1)/2,v0);
  ctx.beginPath();ctx.moveTo(m0[0],m0[1]);ctx.lineTo(m1[0],m1[1]);ctx.stroke();
}
function cyl(cx,cy,r,z0,h,col){
  const b=px(cx,cy,z0),t=px(cx,cy,z0+h);const rx=r*TW*.7071,ry=r*TH*.7071;
  const g=ctx.createLinearGradient(b[0]-rx,0,b[0]+rx,0);
  g.addColorStop(0,sh(col,.16));g.addColorStop(.42,sh(col,-.02));g.addColorStop(1,sh(col,-.42));
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(b[0]-rx,t[1]);ctx.lineTo(b[0]-rx,b[1]);
  ctx.ellipse(b[0],b[1],rx,ry,0,Math.PI,0,true);
  ctx.lineTo(b[0]+rx,t[1]);
  ctx.ellipse(t[0],t[1],rx,ry,0,0,Math.PI,true);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=sh(col,.24);ctx.beginPath();ctx.ellipse(t[0],t[1],rx,ry,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(20,14,20,.18)';ctx.lineWidth=1;ctx.stroke();
  return {x:t[0],y:t[1],rx:rx,ry:ry,bx:b[0],by:b[1]};
}
function pyramid(cx,cy,w,d,z0,h,col){
  const x0=cx-w/2,x1=cx+w/2,y0=cy-d/2,y1=cy+d/2,a=px(cx,cy,z0+h);
  poly([px(x0,y1,z0),px(x1,y1,z0),a],sh(col,.08),'rgba(20,14,20,.15)',1);
  poly([px(x1,y0,z0),px(x1,y1,z0),a],sh(col,-.3),'rgba(20,14,20,.15)',1);
  return a;
}
function ground(cx,cy,r,z,fill,stroke,lw){
  poly([px(cx-r,cy-r,z),px(cx+r,cy-r,z),px(cx+r,cy+r,z),px(cx-r,cy+r,z)],fill,stroke,lw);
}
function glow(x,y,r,c0,a){
  ctx.save();ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c0.replace('A',a));g.addColorStop(1,c0.replace('A',0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
}

/* ================= パーティクル・フロート ================= */
const PT=[],FL=[],PARCELS=[];
function emit(o){if(PT.length<500)PT.push(Object.assign({age:0,life:1,vx:0,vy:0,g:0,size:3,kind:'s',col:'#fff',rot:0,vr:0},o));}
function ring(x,y,max,col,life){emit({kind:'ring',x:x,y:y,size:8,max:max,life:life||.8,col:col||'#f0c56a'});}
function sparkBurst(x,y,n,cols,spd){

    const a=Math.random()*Math.PI*2,s=rnd(.4,1)*(spd||160);
    emit({kind:'conf',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-90,g:340,life:rnd(.7,1.4),size:rnd(3,6),col:cols[(Math.random()*cols.length)|0],rot:Math.random()*6,vr:rnd(-9,9)});
  }
}
function addFloat(x,y,text,big){if(FL.length<36)FL.push({x:x,y:y,text:text,age:0,life:big?1.5:1.1,big:!!big});}
function depotTop(){return px(0,0,.9);}

/* ================= 音 ================= */
let AC=null,master=null,lastBlip=0,upStep=0,lastUp=0;
function audioInit(){
  try{
    if(AC){if(AC.state==='suspended')AC.resume();return;}
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  }catch(e){AC=null;}
}
function tone(f,d,type,v,delay,slide){
  if(!AC||!S.sound)return;
  const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.08,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
const PENT=[0,2,4,7,9];
const note=n=>261.63*Math.pow(2,(PENT[n%5]+12*Math.floor(n/5))/12);
const sfx={
  blip(){const n=performance.now();if(n-lastBlip<80)return;lastBlip=n;tone(rnd(1150,1500),.07,'sine',.022);},
  tap(){tone(420,.09,'triangle',.07,0,220);tone(1100,.05,'sine',.03,.01);},
  build(){tone(170,.28,'sine',.16,0,70);tone(note(5),.25,'triangle',.07,.05);tone(note(9),.3,'triangle',.06,.12);},
  up(){const n=performance.now();if(n-lastUp>1400)upStep=0;lastUp=n;const k=Math.min(upStep++,12);tone(note(5+k),.22,'triangle',.085);tone(note(5+k)*2,.16,'sine',.03,.02);},
  milestone(){[5,7,9,12,14].forEach((k,i)=>tone(note(k),.4,'triangle',.08,i*.07));tone(110,.5,'sine',.14,0,60);},
  golden(){[12,14,16,19,21].forEach((k,i)=>tone(note(k),.5,'sine',.05,i*.06));},
  expand(){tone(90,.6,'sine',.2,0,45);[4,7,9,11].forEach((k,i)=>tone(note(k),.45,'triangle',.06,.15+i*.09));}
};

/* ================= ゲーム進行 ================= */
let lastTick=Date.now();
function launch(b){
  const amt=cycleAmt(b);
  if(PARCELS.length>160){credit(amt,false);return;}
  const dist=Math.hypot(b.gx-.2,b.gy-.2);
  PARCELS.push({b:b,t:0,dur:1.0+dist*.13,amt:amt,gx:b.gx,gy:b.gy,z0:bh(b)*.92,ph:Math.random()*6});
}
function credit(amt,fx){
  S.coins+=amt;S.run+=amt;S.total+=amt;S.deliv++;
  if(fx){
    DEPOT.pulse=1;
    const t=depotTop();
    if(FL.length<18)addFloat(t[0]+rnd(-14,14),t[1]-10,'+'+fmt(amt,true));
    const p=px(.2,.2,.14);
    for(let i=0;i<3;i++)emit({kind:'conf',x:p[0],y:p[1],vx:rnd(-60,60),vy:rnd(-150,-70),g:380,life:rnd(.4,.8),size:rnd(2,3.5),col:'#f3cf72',rot:0,vr:rnd(-8,8)});
    sfx.blip();
  }
}
function step(dt){
  gt+=dt;
  ZU=lerp(ZU,S.low?32:72,Math.min(1,dt*7));
  if(S.buffT>0)S.buffT=Math.max(0,S.buffT-dt);
  for(const b of S.b){
    const T=TYPES[b.type];b.t+=dt;
    if(b.t>=T.T){b.t-=T.T;if(b.t>T.T)b.t=0;launch(b);}
    if(b.pulse>0)b.pulse=Math.max(0,b.pulse-dt*2.4);
    b.smk-=dt;
  }
  if(DEPOT.pulse>0)DEPOT.pulse=Math.max(0,DEPOT.pulse-dt*3);
  for(let i=PARCELS.length-1;i>=0;i--){
    const p=PARCELS[i];p.t+=dt;
    if(p.t>=p.dur){credit(p.amt,true);PARCELS.splice(i,1);}
  }
  while(S.unl<TYPES.length-1&&S.run>=TYPES[S.unl+1].cost*.4){S.unl++;toast('「'+TYPES[S.unl].name+'」が建てられるようになった');}
  if(expandT<1)expandT=Math.min(1,expandT+dt/1.3);
  camScale=lerp(camScale,targetScale(),Math.min(1,dt*3));
  if(shake>0)shake=Math.max(0,shake-dt*2.2);
  /* 粒子 */
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i];p.age+=dt;if(p.age>=p.life){PT.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.rot+=p.vr*dt;
  }
  for(let i=FL.length-1;i>=0;i--){FL[i].age+=dt;if(FL[i].age>=FL[i].life)FL.splice(i,1);}
  /* 金の荷 */
  if(!GC.on){GC.next-=dt;if(GC.next<=0){GC.on=true;GC.t=0;GC.dir=Math.random()<.5?1:-1;GC.y0=-rnd(120,300);GC.dur=rnd(15,19);}}
  else{GC.t+=dt;const p=GC.t/GC.dur;
    GC.x=lerp(-1000*GC.dir,1000*GC.dir,p);GC.y=GC.y0+Math.sin(p*9)*28;
    if(p>=1){GC.on=false;GC.next=rnd(55,100);}}
}
const GC={on:false,x:0,y:0,t:0,dur:16,y0:-200,dir:1,next:28};

function applyOffline(sec){
  if(sec<20)return;
  const s=Math.min(sec,8*3600);
  const gain=ips()*s*.5;
  if(gain<1)return;
  S.coins+=gain;S.run+=gain;S.total+=gain;
  showModal('<h2>おかえりなさい</h2><p>留守のあいだも、島の炉は静かに燃えていました。</p><div class="kv"><span>不在時間</span><span>'+fmtTime(s)+'</span><span>稼いだ資金</span><span>+'+fmt(gain)+'</span></div><div class="row"><button class="mbtn pri" data-m="close">受け取る</button></div>');
}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'時間'+m+'分':m+'分';}

/* ================= 建設・強化・拡張 ================= */
function doBuild(i){
  if(!sel)return;
  const c=placeCost(i);
  if(i>S.unl||S.coins<c||bAt(sel.gx,sel.gy)||!isLand(sel.gx,sel.gy))return;
  S.coins-=c;
  const b={gx:sel.gx,gy:sel.gy,type:i,lv:1,t:0,pulse:1,smk:0};S.b.push(b);
  const p=px(b.gx,b.gy,0);
  ring(p[0],p[1],110,'#f0c56a',.7);
  for(let k=0;k<14;k++)emit({kind:'smoke',x:p[0]+rnd(-30,30),y:p[1]+rnd(-6,10),vx:rnd(-30,30),vy:rnd(-40,-12),life:rnd(.6,1.1),size:rnd(7,13),col:'#d8cfbd'});
  sfx.build();shake=Math.max(shake,.18);
  renderStruct();save();
}
function doUpgrade(){
  const b=selB();if(!b||b.depot)return;
  let n=mode==='max'?maxBuy(b):parseInt(mode,10);
  if(mode!=='max'&&upCost(b,n)>S.coins)return;
  if(n<1)return;
  const cost=upCost(b,n);if(cost>S.coins)return;
  const t0=tierOf(b.lv);
  S.coins-=cost;b.lv+=n;b.pulse=1;

  ring(px(b.gx,b.gy,0)[0],px(b.gx,b.gy,0)[1],80,'#f6dc92',.55);
  const t1=tierOf(b.lv);

    milestone(b);
  }else{sfx.up();sparkBurst(p[0],p[1],8,['#f3cf72','#fff1c2'],120);}
}
function milestone(b){
  const p=px(b.gx,b.gy,bh(b)*.6);
  shake=.7;sfx.milestone();
  sparkBurst(p[0],p[1],42,['#f3cf72','#fff1c2','#d98b45','#8fd0c0'],260);
  ring(p[0],p[1],190,'#f0c56a',1);ring(p[0],p[1],130,'#fff1c2',.8);
  toast('「'+TYPES[b.type].name+'」Lv'+b.lv+' ─ 生産力が2倍になった');

function doExpand(){
  if(S.rad>=MAXR)return;

  S.coins-=c;S.rad++;expandT=0;shake=.8;sfx.expand();

}
function doReforge(){
  const g=reforgeGain();if(g<1)return;
  S.gears+=g;S.coins=15;S.run=0;S.b=[];S.rad=2;S.buffT=0;PARCELS.length=0;sel=null;expandT=1;

/* ================= 入力 ================= */
let sel=null,hover=null,mode='1';
const ptrs=new Map();let drag=null,pinch=null;
function selB(){if(!sel)return null;if(sel.gx===0&&sel.gy===0)return DEPOT;return bAt(sel.gx,sel.gy)||null;}
function toWorld(sx,sy){const c=cam();return [(sx-c.ox)/c.s,(sy-c.oy)/c.s];}
function goldHit(sx,sy){if(!GC.on)return false;const w=toWorld(sx,sy);return Math.hypot(w[0]-GC.x,w[1]-GC.y)<Math.max(62,34/cam().s);}
function candidates(sx,sy){
  const w=toWorld(sx,sy),wx=w[0],wy=w[1],out=[];
  const all=S.b.concat([DEPOT]).sort((a,b)=>(b.gx+b.gy)-(a.gx+a.gy));
  for(const b of all){
    const c=px(b.gx,b.gy,0);
    if(Math.abs(wx-c[0])<TW*.3&&wy>c[1]-(bh(b)+.2)*ZU-10&&wy<c[1]+TH*.28)out.push({gx:b.gx,gy:b.gy});
  }
  const u=wx/(TW/2),v=wy/(TH/2);
  const gx=Math.round((u+v)/2),gy=Math.round((v-u)/2);
  if(Math.abs(gx)<=MAXR&&Math.abs(gy)<=MAXR&&!out.some(o=>o.gx===gx&&o.gy===gy))out.push({gx:gx,gy:gy});
  return out;
}
function pick(sx,sy){
  if(goldHit(sx,sy))return {kind:'gold'};
  const c=candidates(sx,sy).filter(t=>isLand(t.gx,t.gy));
  return c.length?{kind:'tile',gx:c[0].gx,gy:c[0].gy}:null;
}
let lastClick={x:-99,y:-99},overlapHinted=false;
function clickAt(sx,sy){
  audioInit();
  if(goldHit(sx,sy)){grabGold();return;}
  const all=candidates(sx,sy);
  const cands=all.filter(t=>isLand(t.gx,t.gy));
  if(!cands.length){if(all.length)toast('この区画は、島を広げると使えるようになる');setSel(null);return;}
  let t=cands[0];
  const near=Math.hypot(sx-lastClick.x,sy-lastClick.y)<16;
  if(cands.length>1&&near&&sel){const i=cands.findIndex(c=>c.gx===sel.gx&&c.gy===sel.gy);if(i>=0)t=cands[(i+1)%cands.length];}
  lastClick={x:sx,y:sy};
  if(cands.length>1&&!overlapHinted){overlapHinted=true;toast('建物が重なっている。同じ場所をもう一度タップすると奥の区画に切り替わる',4200);}
  if(t.gx===0&&t.gy===0){
    const amt=1+ips()*.03;credit(amt,false);S.taps++;
    DEPOT.pulse=1;const dt=depotTop();addFloat(dt[0],dt[1]-4,'+'+fmt(amt,true));
    sfx.tap();ring(px(.2,.2,.1)[0],px(.2,.2,.1)[1],60,'#fff1c2',.45);
  }
  setSel({gx:t.gx,gy:t.gy});
}
function grabGold(){
  GC.on=false;GC.next=rnd(55,100);
  sfx.golden();shake=.5;
  sparkBurst(GC.x,GC.y,50,['#f3cf72','#fff1c2','#ffd27a'],280);ring(GC.x,GC.y,150,'#f6dc92',.9);
  if(Math.random()<.6||ips()<=0){
    const amt=Math.max(ips()*rnd(45,120),30);credit(amt,false);
    addFloat(GC.x,GC.y,'+'+fmt(amt),true);toast('金の荷を受け取った。資金 +'+fmt(amt));
  }else{
    S.buffT=Math.min(S.buffT+30,120);addFloat(GC.x,GC.y,'生産 ×3',true);toast('金の荷が届いた。30秒間、すべての生産が3倍');
  }
}
function localXY(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const q=localXY(e);
  ptrs.set(e.pointerId,{x:q[0],y:q[1]});
  if(ptrs.size===1)drag={moved:0};
  else if(ptrs.size===2){const a=[...ptrs.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),z:userZoom};if(drag)drag.moved=99;}
});
cv.addEventListener('pointermove',e=>{
  const q=localXY(e);const p=ptrs.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'){const k=pick(q[0],q[1]);hover=k&&k.kind==='tile'&&isLand(k.gx,k.gy)?k:null;cv.classList.toggle('pointer',!!k&&(k.kind==='gold'||(k.kind==='tile'&&isLand(k.gx,k.gy))));}return;}
  const dx=q[0]-p.x,dy=q[1]-p.y;p.x=q[0];p.y=q[1];
  if(ptrs.size===2&&pinch){const a=[...ptrs.values()];userZoom=clamp(pinch.z*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/pinch.d,.6,2.4);return;}
  if(drag){drag.moved+=Math.abs(dx)+Math.abs(dy);if(drag.moved>8){panX=clamp(panX+dx,-520,520);panY=clamp(panY+dy,-360,360);}}
});
function endPtr(e,cancel){
  const q=localXY(e);const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(!had)return;
  if(ptrs.size===0){if(drag&&drag.moved<=8&&!cancel)clickAt(q[0],q[1]);drag=null;pinch=null;}
  else if(ptrs.size<2)pinch=null;
}
cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('pointerleave',()=>{hover=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();userZoom=clamp(userZoom*Math.exp(-e.deltaY*.0012),.6,2.4);},{passive:false});
cv.addEventListener('dblclick',()=>{userZoom=1;panX=0;panY=0;});

panel.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;audioInit();
  const a=t.dataset.act;
  if(a==='build'){doBuild(parseInt(t.dataset.i,10));}
  else if(a==='up')doUpgrade();
  else if(a==='mode'){mode=t.dataset.m;updatePanel(true);}
});

function renderStruct(){
  const b=selB();
  let key,html;
  if(!sel){key='none';html='<div class="tip"><b>集荷塔</b>をタップで資金が増える。区画を選んで建物を建て、空を横切る<b>金の荷</b>を見つけたらすぐ触れよう。ドラッグで移動、ピンチで拡大。</div>';}
  else if(b&&b.depot){key='depot';html='<div class="ph"><span class="pt">集荷塔</span><span class="ps">島のすべての荷がここへ届く</span></div><div class="tip">タップ1回で <b id="dTap"></b> の資金。生産が育つほど、1タップの価値も上がる。<br>納品した荷:<b id="dDel"></b>個</div>';}
  else if(b){key='b'+b.type;html='<div class="bwrap"><div class="bl"><div class="bn"><span id="bn"></span><span class="lvb" id="blv"></span></div><div class="bd" id="bd"></div><div class="bst"><div><b id="brate"></b><small>毎秒</small></div><div><b id="bcyc"></b><small>1回の納品</small></div><div><b id="bmul"></b><small>倍率</small></div></div><div class="ms"><div class="bar"><i id="bbar"></i></div><div class="mt" id="bnext"></div></div></div><div class="br"><div class="seg"><button data-act="mode" data-m="1">×1</button><button data-act="mode" data-m="10">×10</button><button data-act="mode" data-m="max">最大</button></div><button class="go" id="bgo" data-act="up"><span id="bgol"></span><span class="gc">'+coinG+'<span id="bgoc"></span></span></button></div></div>';}
  else{key='empty';html='<div class="ph"><span class="pt">空き区画</span><span class="ps">建てる建物を選ぶ</span></div><div class="cards">'+TYPES.map((T,i)=>'<button class="card" data-act="build" data-i="'+i+'"><div class="cn"></div><div class="cd"></div><div class="cr"><span class="cp">'+coinG+'<span class="ccost"></span></span><span class="cs"></span></div></button>').join('')+'</div>';}
  structKey=key;panel.innerHTML=html;updatePanel(true);
}
function setText(el,t){if(el&&el.textContent!==t)el.textContent=t;}
function updatePanel(force){
  const b=selB();
  if(!sel){return;}
  if(b&&b.depot){setText($('#dTap'),fmt(1+ips()*.03,true));setText($('#dDel'),S.deliv.toLocaleString('ja-JP'));return;}
  if(b){
    const T=TYPES[b.type];
    setText($('#bn'),T.name);setText($('#blv'),'Lv '+b.lv);setText($('#bd'),T.desc);
    setText($('#brate'),fmt(rateOf(b),true));setText($('#bcyc'),fmt(cycleAmt(b),true)+' / '+T.T+'秒');setText($('#bmul'),'×'+fmt(multOf(b.lv)*(1+.08*S.gears)));
    const nx=MS.find(m=>m>b.lv);const pv=[0].concat(MS).filter(m=>m<=b.lv).pop();
    if(nx){$('#bbar').style.width=(100*(b.lv-pv)/(nx-pv)).toFixed(1)+'%';setText($('#bnext'),'Lv'+nx+'で生産力2倍(あと'+(nx-b.lv)+')');}
    else{$('#bbar').style.width='100%';setText($('#bnext'),'これ以上の倍化はない');}
    document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.m===mode));
    let n=mode==='max'?Math.max(1,maxBuy(b)):parseInt(mode,10);
    const cost=upCost(b,n);const ok=mode==='max'?maxBuy(b)>=1:S.coins>=cost;
    setText($('#bgol'),'強化 +'+n);setText($('#bgoc'),fmt(cost));$('#bgo').disabled=!ok;
    return;
  }
  const cards=panel.querySelectorAll('.card');
  cards.forEach((c,i)=>{
    const T=TYPES[i];const un=i<=S.unl;const cost=placeCost(i);
    c.classList.toggle('locked',!un);c.classList.toggle('poor',un&&S.coins<cost);
    c.disabled=!un;
    setText(c.querySelector('.cn'),un?T.name:'???');
    setText(c.querySelector('.cd'),un?T.desc:'資金'+fmt(Math.ceil(T.cost*.4))+'を稼ぐと解禁');
    setText(c.querySelector('.ccost'),un?fmt(cost):'─');
    setText(c.querySelector('.cs'),un?'+'+fmt(T.inc/T.T*gm(),true)+'/秒':'');
  });
}

let hudT=0,dispCoins=15;
function updateHud(dt){
  dispCoins+= (S.coins-dispCoins)*Math.min(1,dt*10);
  if(Math.abs(S.coins-dispCoins)<.5)dispCoins=S.coins;
  setText($('#coins'),fmt(dispCoins));
  setText($('#ips'),'+'+fmt(ips(),true)+'/秒');
  const bf=$('#buff');
  if(S.buffT>0){bf.classList.remove('hidden');setText(bf,'生産×3  あと'+Math.ceil(S.buffT)+'秒');}else bf.classList.add('hidden');
  const gc=$('#gearchip');if(S.gears>0){gc.classList.remove('hidden');setText($('#gears'),String(S.gears));}else gc.classList.add('hidden');
  setText($('#btnView'),S.low?'建物を元の高さに戻す':'建物を低く表示');
  const be=$('#btnExpand');
  if(S.rad>=MAXR){be.classList.add('hidden');}
  else{be.classList.remove('hidden');const c=EXPAND_COST[S.rad+1];
    const html='島を広げる '+coinG+fmt(c);
    if(be.dataset.k!==html){be.dataset.k=html;be.innerHTML=html;}
    be.disabled=S.coins<c;}
  const br=$('#btnReforge');
  if(S.run>=REFORGE_MIN*.4||S.gears>0){br.classList.remove('hidden');const g=reforgeGain();const t='再起動'+(g>=1?'(歯車+'+g+')':'(あと'+fmt(Math.max(0,REFORGE_MIN-S.run))+')');setText(br,t);br.disabled=g<1&&false;br.style.opacity=g<1?.6:1;}
  else br.classList.add('hidden');
  hudT+=dt;
  if(hudT>.2){hudT=0;updatePanel();}
}

/* ================= 描画:世界 ================= */
function drawWater(c){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createRadialGradient(c.ox,c.oy,40,c.ox,c.oy,Math.max(W,H)*.9);
  g.addColorStop(0,'#7cc0b8');g.addColorStop(.3,'#4f9aa2');g.addColorStop(.7,'#2b6579');g.addColorStop(1,'#173c4d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawWaves(){
  ctx.lineCap='round';
  for(let i=0;i<80;i++){
    const sp=6+hash(i,3)*10;
    const x=((hash(i,1)*3400+gt*sp)%3400)-1700,y=(hash(i,2)-.5)*1900;
    const a=.07+.11*Math.max(0,Math.sin(gt*.7+i*1.7));
    ctx.strokeStyle='rgba(235,250,246,'+a.toFixed(3)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+16,y-5,x+34,y);ctx.stroke();
  }
}
function shallowTile(gx,gy){
  const top=[px(gx-.5,gy-.5,-.06),px(gx+.5,gy-.5,-.06),px(gx+.5,gy+.5,-.06),px(gx-.5,gy+.5,-.06)];
  poly(top,'rgba(188,214,176,.42)','rgba(235,250,240,.28)',1.5);
  const c=px(gx,gy,-.06);const a=.15+.12*Math.sin(gt*1.2+gx*1.3+gy*.7);
  ctx.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(c[0],c[1],20,10,0,0,Math.PI*2);ctx.stroke();
}
function landTile(gx,gy,zo){
  const D=.4;const x0=gx-.5,x1=gx+.5,y0=gy-.5,y1=gy+.5;
  if(!isLand(gx,gy+1)){
    const q=[px(x0,y1,zo),px(x1,y1,zo),px(x1,y1,zo-D),px(x0,y1,zo-D)];
    fillV(q,'#a28b64','#665641');
    const lip=[px(x0,y1,zo),px(x1,y1,zo),px(x1,y1,zo-.07),px(x0,y1,zo-.07)];poly(lip,'#7f9a58');
    ctx.strokeStyle='rgba(40,28,20,.2)';ctx.lineWidth=1.4;
    for(const f of [.4,.7]){const a=px(x0,y1,zo-D*f),b=px(x1,y1,zo-D*f);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    const a=px(x0,y1,zo-D),b=px(x1,y1,zo-D);
    ctx.strokeStyle='rgba(240,252,248,.6)';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(a[0],a[1]+1);ctx.lineTo(b[0],b[1]+1);ctx.stroke();
  }
  if(!isLand(gx+1,gy)){
    const q=[px(x1,y0,zo),px(x1,y1,zo),px(x1,y1,zo-D),px(x1,y0,zo-D)];
    fillV(q,'#7c694a','#4b3f2f');
    const lip=[px(x1,y0,zo),px(x1,y1,zo),px(x1,y1,zo-.07),px(x1,y0,zo-.07)];poly(lip,'#657f45');
    ctx.strokeStyle='rgba(30,20,14,.22)';ctx.lineWidth=1.4;
    for(const f of [.4,.7]){const a=px(x1,y0,zo-D*f),b=px(x1,y1,zo-D*f);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
    const a=px(x1,y0,zo-D),b=px(x1,y1,zo-D);
    ctx.strokeStyle='rgba(230,246,242,.5)';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(a[0],a[1]+1);ctx.lineTo(b[0],b[1]+1);ctx.stroke();
  }
  const top=[px(x0,y0,zo),px(x1,y0,zo),px(x1,y1,zo),px(x0,y1,zo)];
  const h=hash(gx,gy,1);
  poly(top,sh('#9bb36b',(h-.5)*.13+(((gx+gy)&1)?.035:-.01)),'rgba(48,66,34,.22)',1);
  for(let i=0;i<7;i++){
    const u=hash(gx,gy,i+3),v=hash(gx,gy,i+17);
    const p=px(gx-.4+u*.8,gy-.4+v*.8,zo);
    ctx.strokeStyle=(i&1)?'rgba(62,92,40,.55)':'rgba(206,224,150,.55)';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]-2,p[1]-6);ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+3,p[1]-5);ctx.stroke();
  }
  if(hash(gx,gy,40)>.7){
    const p=px(gx+(hash(gx,gy,41)-.5)*.6,gy+(hash(gx,gy,42)-.5)*.6,zo);
    ctx.fillStyle='rgba(190,186,170,.9)';ctx.beginPath();ctx.ellipse(p[0],p[1],5,2.6,0,0,Math.PI*2);ctx.fill();
  }
}
function plotMark(gx,gy){
  const top=[px(gx-.36,gy-.36,0),px(gx+.36,gy-.36,0),px(gx+.36,gy+.36,0),px(gx-.36,gy+.36,0)];
  ctx.setLineDash([7,7]);ctx.strokeStyle='rgba(255,250,225,.34)';ctx.lineWidth=1.6;
  poly(top,null,'rgba(255,250,225,.34)',1.6);ctx.setLineDash([]);
}
function highlight(gx,gy,kind){
  const top=[px(gx-.5,gy-.5,0),px(gx+.5,gy-.5,0),px(gx+.5,gy+.5,0),px(gx-.5,gy+.5,0)];
  if(kind==='hover'){poly(top,'rgba(255,250,220,.2)');return;}
  const a=.75+.25*Math.sin(gt*5);
  poly(top,'rgba(255,240,190,.2)','rgba(246,208,102,'+a.toFixed(2)+')',3);
}
function plotBase(b){
  ground(b.gx,b.gy,.44,0,sh('#c3b393',-.02));
  ground(b.gx,b.gy,.44,0,null,'rgba(70,52,30,.3)',1.2);
  for(let i=0;i<6;i++){const p=px(b.gx-.38+hash(b.gx,b.gy,i+60)*.76,b.gy-.38+hash(b.gx,b.gy,i+70)*.76,0);
    ctx.fillStyle='rgba(120,100,70,.35)';ctx.beginPath();ctx.ellipse(p[0],p[1],4,2,0,0,Math.PI*2);ctx.fill();}
}
function progressRing(b){
  const T=TYPES[b.type],c=px(b.gx,b.gy,0),rx=.5*TW*.7071,ry=.5*TH*.7071;
  ctx.strokeStyle='rgba(255,250,225,.2)';ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(c[0],c[1],rx,ry,0,0,Math.PI*2);ctx.stroke();
  const p=b.t/T.T;
  ctx.strokeStyle='rgba(246,214,120,.95)';ctx.lineWidth=2.6;ctx.beginPath();ctx.ellipse(c[0],c[1],rx,ry,0,-Math.PI/2,-Math.PI/2+Math.PI*2*p);ctx.stroke();
}
function shadowOf(b){
  const k=b.depot?1:hk(b);const h=b.depot?.9:BASEH[b.type]*k;
  const w=b.depot?.9:.78,d=b.depot?.9:.66,ext=.12+h*.38;
  const x0=b.gx-w/2,y0=b.gy-d/2,y1=b.gy+d/2,x1=b.gx+w/2;
  poly([px(x0,y0,0),px(x1+ext,y0,0),px(x1+ext,y1,0),px(x0,y1,0)],'rgba(18,36,30,.16)');
  poly([px(x0+.04,y0+.04,0),px(x1+ext*.6,y0+.04,0),px(x1+ext*.6,y1-.04,0),px(x0+.04,y1-.04,0)],'rgba(18,36,30,.12)');
}
function crown(b,x,y,z){
  const tr=tierOf(b.lv);if(tr<1)return;
  const a=px(x,y,z),t=px(x,y,z+.3);
  ctx.strokeStyle='#4a3a2a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(t[0],t[1]);ctx.stroke();
  const w=Math.sin(gt*4+b.gx)*3;const sz=10+Math.min(tr,4)*2;
  poly([[t[0],t[1]],[t[0]+sz+w,t[1]+4],[t[0],t[1]+8]],tr>=4?'#e6bb5a':'#c4472f');
  if(tr>=3)glow(t[0],t[1],26+tr*4,'rgba(255,214,120,A)',.4);
}
function smoke(b,x,y,z,col,rate){
  if(b.smk>0)return;
  b.smk=rate*(.7+Math.random()*.6);
  const p=px(x,y,z);
  emit({kind:'smoke',x:p[0],y:p[1],vx:rnd(8,20),vy:rnd(-34,-22),life:rnd(1.6,2.4),size:rnd(5,8),col:col});
}

/* --- 建物 --- */
function dWorkshop(b){
  const cx=b.gx,cy=b.gy,k=hk(b),tr=tierOf(b.lv),bh=.36*k,lit=tr>=1;
  const B=box(cx,cy,.66,.56,0,bh,'#e5d5af');
  ctx.strokeStyle='rgba(88,56,36,.7)';ctx.lineWidth=2.4;
  let a=B.L(0,.5),c=B.L(1,.5);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
  win(B,'L',.12,.12,.32,.42,lit);win(B,'L',.62,.12,.82,.42,lit);
  win(B,'L',.12,.6,.32,.9,lit);win(B,'L',.62,.6,.82,.9,lit);
  const dq=[B.R(.3,.66),B.R(.7,.66),B.R(.7,0),B.R(.3,0)];fillV(dq,'#7b5236','#4e3322');
  const rz=bh+.26,o=.06,x0=B.x0-o,x1=B.x1+o,y0=B.y0-o,y1=B.y1+o,cyy=cy;
  poly([px(B.x1,B.y0,bh),px(B.x1,B.y1,bh),px(B.x1,cyy,rz)],sh('#e5d5af',-.28));
  poly([px(x0,y0,bh),px(x1,y0,bh),px(x1,cyy,rz),px(x0,cyy,rz)],'#8e4630');
  const fr=[px(x0,cyy,rz),px(x1,cyy,rz),px(x1,y1,bh),px(x0,y1,bh)];
  fillV(fr,'#d0694a','#a74f35');
  ctx.strokeStyle='rgba(60,24,14,.3)';ctx.lineWidth=1.3;
  for(let i=1;i<5;i++){const t=i/5,A=px(x0,lerp(cyy,y1,t),lerp(rz,bh,t)),Bp=px(x1,lerp(cyy,y1,t),lerp(rz,bh,t));ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(Bp[0],Bp[1]);ctx.stroke();}
  ctx.strokeStyle='rgba(255,226,190,.5)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(fr[0][0],fr[0][1]);ctx.lineTo(fr[1][0],fr[1][1]);ctx.stroke();
  box(cx+.17,cy-.12,.12,.12,rz-.06,.2*k,'#9a5a45');
  smoke(b,cx+.17,cy-.12,rz+.16,'#e6e1d6',.5);
  crown(b,cx-.2,cy+.05,rz-.02);
}
function dMill(b){
  const cx=b.gx,cy=b.gy,k=hk(b),tr=tierOf(b.lv),bh=.72*k,lit=tr>=1;
  box(cx,cy,.58,.58,0,.1,'#9d917c');
  const B=box(cx,cy,.5,.5,.1,bh,'#d9cebb');
  ctx.strokeStyle='rgba(60,46,34,.16)';ctx.lineWidth=1.2;
  for(let i=1;i<5;i++){let a=B.L(0,i/5),c=B.L(1,i/5);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();a=B.R(0,i/5);c=B.R(1,i/5);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();}
  win(B,'L',.38,.58,.62,.86,lit);win(B,'L',.38,.18,.62,.42,lit);
  fillV([B.L(.1,.3),B.L(.28,.3),B.L(.28,0),B.L(.1,0)],'#7b5236','#4e3322');
  const z=.1+bh;
  const top=pyramid(cx,cy,.64,.64,z,.34,'#8d5b3e');
  const hx=B.x1+.05,hz=.1+bh*.66,hy=cy,L=.46*Math.min(1.3,k*.85);
  const rot=gt*(.9+tr*.15);
  const hub=px(hx,hy,hz);
  for(let i=0;i<4;i++){
    const an=rot+i*Math.PI/2,cs=Math.cos(an),sn=Math.sin(an);
    const P=(s,o)=>px(hx,hy+cs*s-sn*o,hz+sn*s+cs*o);
    const tip=P(L,0);
    ctx.strokeStyle='#5a4030';ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(hub[0],hub[1]);ctx.lineTo(tip[0],tip[1]);ctx.stroke();
    const q=[P(L*.2,.02),P(L,.02),P(L,.15),P(L*.2,.15)];
    poly(q,'rgba(247,238,214,.94)','#6b4b36',1.3);
    ctx.strokeStyle='rgba(107,75,54,.5)';ctx.lineWidth=1;
    for(let j=1;j<4;j++){const s=lerp(L*.2,L,j/4),a=P(s,.02),c=P(s,.15);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();}
  }
  ctx.fillStyle='#d9a441';ctx.beginPath();ctx.arc(hub[0],hub[1],5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(60,40,10,.6)';ctx.lineWidth=1.2;ctx.stroke();
  crown(b,cx,cy,top?z+.34-.02:z);
}
function dFoundry(b){
  const cx=b.gx,cy=b.gy,k=hk(b),tr=tierOf(b.lv),bh=.38*k,lit=tr>=1;
  const ch=cyl(cx-.22,cy-.16,.1,0,bh+.75*k,'#93503c');
  ctx.strokeStyle='rgba(30,16,12,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(ch.x,ch.y,ch.rx,ch.ry,0,0,Math.PI*2);ctx.stroke();
  const B=box(cx,cy,.84,.64,0,bh,'#a85c45');
  ctx.strokeStyle='rgba(40,18,12,.17)';ctx.lineWidth=1.2;
  for(let i=1;i<6;i++){let a=B.L(0,i/6),c=B.L(1,i/6);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();a=B.R(0,i/6);c=B.R(1,i/6);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();}
  const R=box(cx,cy,.9,.7,bh,.05,'#4e5359');
  box(cx+.15,cy+.05,.22,.18,bh+.05,.1,'#3d4146');
  box(cx-.1,cy+.15,.22,.18,bh+.05,.07,'#3d4146');

function drawParticles(){
  for(const p of PT){
    const t=p.age/p.life;
    if(p.kind==='smoke'){
      ctx.globalAlpha=(1-t)*(1-t)*.42;ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+t*2.6),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    }else if(p.kind==='spark'){
      glow(p.x,p.y,p.size*4.5,p.col,(1-t));
      ctx.globalAlpha=1-t;ctx.fillStyle='#fff3cf';ctx.fillRect(p.x-1,p.y-1,2,2);ctx.globalAlpha=1;
    }else if(p.kind==='conf'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,(1-t)*2);
      ctx.fillStyle=p.col;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();ctx.globalAlpha=1;
    }else if(p.kind==='ring'){

  ctx.setTransform(DPR*c.s,0,0,DPR*c.s,DPR*(c.ox+sx),DPR*(c.oy+sy));
  drawWaves();
  const R=S.rad;
  for(let gx=-MAXR;gx<=MAXR;gx++)for(let gy=-MAXR;gy<=MAXR;gy++)if(!isLand(gx,gy))shallowTile(gx,gy);
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    const ringed=Math.max(Math.abs(gx),Math.abs(gy))===R&&expandT<1;
    const e=1-Math.pow(1-expandT,3);
    const zo=ringed?-(1-e)*.9:0;
    if(ringed)ctx.globalAlpha=Math.max(.02,e);
    landTile(gx,gy,zo);
    ctx.globalAlpha=1;
  }
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    if(gx===0&&gy===0)continue;
    if(!bAt(gx,gy))plotMark(gx,gy);
  }
  if(hover&&isLand(hover.gx,hover.gy))highlight(hover.gx,hover.gy,'hover');
  if(sel)highlight(sel.gx,sel.gy,'sel');
  if(S.b.length===0&&!sel){
    const a=.5+.5*Math.sin(gt*3.2);
    poly([px(.5,-.5,0),px(1.5,-.5,0),px(1.5,.5,0),px(.5,.5,0)],'rgba(255,240,190,'+(.1+.16*a).toFixed(2)+')','rgba(246,208,102,'+(.5+.4*a).toFixed(2)+')',3);
  }
  for(const b of S.b)shadowOf(b);shadowOf(DEPOT);
  const objs=S.b.concat([DEPOT]);
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    const o=(gx===0&&gy===0)?DEPOT:bAt(gx,gy);if(!o)continue;
    const tg=sel&&objs.length&&covers(o,sel.gx,sel.gy)?.24:1;
    o.fa=lerp(o.fa==null?1:o.fa,tg,.22);
    ctx.globalAlpha=o.fa;drawObject(o);ctx.globalAlpha=1;
  }
  for(const p of PARCELS)drawParcel(p);
  /* 最前面:隠れた区画の目印・選択表示・レベル札 */
  const fs=clamp(12/c.s,12,30);
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    if(gx===0&&gy===0)continue;
    const isSel=sel&&sel.gx===gx&&sel.gy===gy;
    if(!bAt(gx,gy)){if(objs.some(o=>covers(o,gx,gy)))plotTop(gx,gy,isSel);}
    else if(isSel&&objs.some(o=>covers(o,gx,gy)))plotTop(gx,gy,true);
  }
  for(const b of S.b)badge(b,fs);
  if(hover&&!(sel&&hover.gx===sel.gx&&hover.gy===sel.gy)&&isLand(hover.gx,hover.gy))tag(hover.gx,hover.gy,fs,false);
  if(sel)tag(sel.gx,sel.gy,fs*1.08,true);
  drawClouds();
  drawParticles();
  drawGold();
  drawFloats();
  /* ビネット */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const v=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.35,W/2,H*.48,Math.max(W,H)*.8);
  v.addColorStop(0,'rgba(6,18,24,0)');v.addColorStop(1,'rgba(6,18,24,.42)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

/* ================= ループ ================= */
let last=0,saveT=0,started=false;
function frame(now){
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=.016;dt=Math.min(dt,.1);
  if(started){
    step(dt);updateHud(dt);
    saveT+=dt;if(saveT>5){saveT=0;save();}
  }
  render();
  lastTick=Date.now();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();return;}
  if(!started)return;
  const away=(Date.now()-lastTick)/1000;
  if(away>15){applyOffline(away);}
});
window.addEventListener('beforeunload',()=>{if(!wiping&&started)save();});

/* ================= 起動 ================= */
function begin(fresh){
  audioInit();
  let away=0;
  if(!fresh){const d=load();if(d){applySave(d);away=(Date.now()-(d.t||Date.now()))/1000;}}
  else{try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=defaultState();}
  started=true;dispCoins=S.coins;camScale=targetScale()*.9;
  $('#splash').classList.add('out');
  sel=null;renderStruct();
  if(S.b.length===0)toast('光っている区画をタップして、最初の工房を建てよう',4200);
  setTimeout(()=>{if(away>20)applyOffline(away);},900);
}
$('#btnStart').addEventListener('click',()=>begin(false));
$('#btnFresh').addEventListener('click',()=>begin(true));
if(hasSave())$('#btnFresh').classList.remove('hidden');
resize();camScale=targetScale();renderStruct();
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
