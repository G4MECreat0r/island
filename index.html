<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>鋳物の島 Foundry Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17323c;
  --panel:rgba(236,242,239,.92);
  --panel-solid:#ecf2ef;
  --ink:#16262c;
  --ink2:#52666d;
  --line:rgba(22,38,44,.16);
  --brass:#b98a22;
  --brass-hi:#e6bb5a;
  --brass-ink:#2a1c04;
  --ok:#3f7b57;
  --bad:#a4452d;
  --verd:#2f7f72;
  --shadow:0 12px 32px rgba(8,22,28,.38);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:rgba(14,30,37,.9);--panel-solid:#0e1e25;--ink:#e8efec;--ink2:#9fb3b8;--line:rgba(232,239,236,.14);
    --brass:#d9a441;--brass-hi:#f0c56a;--ok:#8cc49a;--bad:#e08a6e;--verd:#79c2b1;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(14,30,37,.9);--panel-solid:#0e1e25;--ink:#e8efec;--ink2:#9fb3b8;--line:rgba(232,239,236,.14);
  --brass:#d9a441;--brass-hi:#f0c56a;--ok:#8cc49a;--bad:#e08a6e;--verd:#79c2b1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;font-weight:500;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#cv.pointer{cursor:pointer}
.hidden{display:none!important}
.serif{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#hud>*{pointer-events:auto}
.bank{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px 9px 14px;box-shadow:var(--shadow);min-width:150px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bank .lbl{font-size:11px;color:var(--ink2);letter-spacing:.06em}
.bank .num{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(28px,6.4vw,38px);line-height:1.1;font-variant-numeric:tabular-nums}
.bank .rate{font-size:13px;color:var(--verd);font-weight:700;font-variant-numeric:tabular-nums}
.hudr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:700;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip svg{width:16px;height:16px;flex:none}
.chip.buff{border-color:var(--brass);color:var(--brass-ink);background:linear-gradient(180deg,var(--brass-hi),var(--brass))}
.iconbtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;box-shadow:var(--shadow);padding:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:focus-visible,.chip:focus-visible,.card:focus-visible,.go:focus-visible,.seg button:focus-visible,.mbtn:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}

/* Dock */
#dock{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(10px + 0px);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
#dock>*{pointer-events:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button.chip{cursor:pointer;color:var(--ink)}
button.chip:disabled{opacity:.5;cursor:default}
button.chip:not(:disabled):active{transform:translateY(1px)}
#panel{width:min(780px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;min-height:84px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ph{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px}
.pt{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:17px}
.ps{font-size:12px;color:var(--ink2)}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.card{flex:0 0 auto;width:158px;text-align:left;border:1px solid var(--line);border-radius:9px;background:transparent;padding:9px 10px 9px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.card:not(.locked):not(.poor):hover{border-color:var(--brass);background:rgba(185,138,34,.08)}
.card .cn{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:15px}
.card .cd{font-size:11px;color:var(--ink2);line-height:1.45;min-height:32px}
.card .cr{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.card .cs{color:var(--verd)}
.card .cp{display:inline-flex;gap:5px;align-items:center}
.card.poor .cp{color:var(--bad)}
.card.locked{opacity:.5;cursor:default}
.cc{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2,#e0a93a 55%,#9a6c14);box-shadow:0 0 0 1px rgba(90,60,10,.4);display:inline-block;flex:none}
.bwrap{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.bn{display:flex;align-items:center;gap:9px;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:18px}
.lvb{font-family:'Zen Kaku Gothic New',sans-serif;font-size:12px;background:var(--ink);color:var(--panel-solid);border-radius:5px;padding:2px 7px;font-weight:700}
.bd{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.bst{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:6px}
.adjl{font-size:11px;color:var(--verd);margin:0 0 7px;font-weight:700;line-height:1.5}
.card .cx{font-size:11px;color:var(--verd);font-weight:700}
.bst div{display:flex;flex-direction:column;line-height:1.2}
.bst b{font-size:16px;font-variant-numeric:tabular-nums}
.bst small{font-size:11px;color:var(--ink2)}
.ms{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:260px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.mt{font-size:11px;color:var(--ink2);white-space:nowrap}
.br{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:176px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:6px 0;font-size:12px;font-weight:700;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--panel-solid)}
.go{border:1px solid #8a6414;border-radius:9px;background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);font-weight:800;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 rgba(90,60,10,.35);font-size:14px}
.go .gc{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-size:13px}
.go:disabled{opacity:.42;cursor:default;box-shadow:none}
.go:not(:disabled):active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.tip{font-size:13px;color:var(--ink2);line-height:1.7}
.tip b{color:var(--ink)}

/* Toast / modal */
#toast{position:absolute;left:50%;top:calc(88px);transform:translate(-50%,-6px);background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:min(92vw,520px);text-align:center;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:absolute;inset:0;background:rgba(6,16,20,.55);display:grid;place-items:center;padding:16px;z-index:8}
#modal .mc{max-height:92%;overflow-y:auto;width:min(460px,100%);background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
#modal h2{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:21px;margin:0 0 10px}
#modal p{font-size:14px;line-height:1.75;margin:0 0 14px;color:var(--ink)}
#modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px}
.mbtn.pri{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:#8a6414}
.mbtn.dng{color:var(--bad);border-color:var(--bad)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}
.agrid .mbtn{padding:8px 6px;font-size:13px}
.agrid h3{grid-column:1/-1;margin:6px 0 0;font-size:12px;color:var(--ink2);font-weight:700}
.trow,.arow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tn{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:15px;display:flex;gap:8px;align-items:center}
.td{font-size:12px;color:var(--ink2);line-height:1.6;margin-top:3px}
.td b{color:var(--ink)}
.mbtn:disabled{opacity:.4;cursor:default}
.arow.off{opacity:.45}
.arow .ok{font-size:12px;font-weight:700;color:var(--ok)}
#modal p.small{font-size:12px;color:var(--ink2);margin:0 0 8px}
.rank{margin-top:7px;font-size:11px;color:var(--ink2);cursor:pointer;font-weight:700}
.rbar{height:4px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass-hi))}
.br .mbtn{padding:6px 8px;font-size:12px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px;margin:0 0 14px}
.kv span:nth-child(even){font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* Splash */
#splash{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:radial-gradient(120% 90% at 50% 38%,#2c6072 0%,#17323c 55%,#0d1d24 100%);color:#e8efec;transition:opacity .9s ease,visibility .9s}
#splash.out{opacity:0;visibility:hidden}
#splash h1{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(40px,11vw,76px);margin:0;letter-spacing:.04em;line-height:1.05}
#splash .sub{font-size:clamp(13px,3.4vw,16px);line-height:1.9;color:#a9c0c5;max-width:30em}
#splash .go{padding:12px 34px;font-size:16px;border-radius:10px}
#splash .alt{background:none;border:0;color:#a9c0c5;font-size:12px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){
  .bwrap{grid-template-columns:1fr}
  .br{flex-direction:row;align-items:center;min-width:0}
  .br .seg{flex:0 0 132px}.br .go{flex:1}
  .card{width:146px}
  #hud{padding:10px}
}
@media (prefers-reduced-motion: reduce){#toast,#splash{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="bank">
      <div class="lbl">資金</div>
      <div class="num" id="coins">0</div>
      <div class="rate" id="ips">+0/秒</div>
      <div class="rank" id="rank"><span id="rankt"></span><div class="rbar"><i id="rbari"></i></div></div>
    </div>
    <div class="hudr">
      <div class="chip buff hidden" id="buff"></div>
      <div class="chip hidden" id="gearchip" title="歯車:多いほど生産が伸びる(伸びは徐々に緩やかになる)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        <span id="gears">0</span>
      </div>
      <button class="chip" id="btnWx"></button>
      <button class="chip" id="btnAch"></button>
      <button class="chip hidden" id="btnTech"></button>
      <button class="iconbtn" id="btnMenu" aria-label="メニュー">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="dock">
    <div class="chips">
      <button class="chip" id="btnView"></button>
      <button class="chip" id="btnExpand"></button>
      <button class="chip hidden" id="btnReforge"></button>
    </div>
    <div id="panel"></div>
  </div>

  <div id="modal" class="hidden"><div class="mc" id="mc"></div></div>

  <div id="splash">
    <h1>鋳物の島</h1>
    <div class="sub">小さな工房がひとつ。<br>やがて島は煙突の森になり、空には荷運びの飛行機が行き交う。</div>
    <button class="go" id="btnStart">島へ向かう</button>
    <button class="alt hidden" id="btnFresh">最初からはじめる</button>
  </div>
</div>

<script>
(()=>{
'use strict';

/* ================= 定数・ユーティリティ ================= */
const TW=128, TH=64, MAXR=7;
let ZU=72;
const SAVE_KEY='foundryIsle.v1';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(x,y,s){s=s||0;let h=(x*374761393+y*668265263+s*1274126177)|0;h=(h^(h>>>13))*1274126177|0;h^=h>>>16;return (h>>>0)/4294967295;}
const UNITS=['','万','億','兆','京','垓','秭','穣','溝','澗','正'];
function fmt(v,rate){
  if(!isFinite(v)) return '∞';
  if(v<0) v=0;
  if(v<1e4){
    if(rate&&v<100) return v.toFixed(v<10?2:1);
    return Math.floor(v).toLocaleString('ja-JP');
  }
  let e=Math.floor(Math.log10(v)/4);
  e=Math.min(e,UNITS.length-1);
  let m=v/Math.pow(10,e*4);
  const f=x=>{const r=parseFloat(x.toFixed(2));return String(r>=100?Math.round(x):r>=10?parseFloat(x.toFixed(1)):r);};
  let s=f(m);
  if(parseFloat(s)>=10000&&e<UNITS.length-1){e++;m=v/Math.pow(10,e*4);s=f(m);}
  if(m>=1e4) return v.toExponential(2);
  return s+UNITS[e];
}
const cache=new Map();
function sh(hex,k){
  const key=hex+k;let v=cache.get(key);if(v)return v;
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=k<0?[34,28,40]:[255,244,218],a=Math.abs(k);
  r=Math.round(r+(t[0]-r)*a);g=Math.round(g+(t[1]-g)*a);b=Math.round(b+(t[2]-b)*a);
  v='rgb('+r+','+g+','+b+')';cache.set(key,v);return v;
}

/* ================= ゲームデータ ================= */
const TYPES=[
  {id:'workshop',name:'工房',desc:'職人が小物を打ち出す、島のはじまり。',cost:12,inc:1,T:2,g:1.15},
  {id:'mill',name:'風車製粉所',desc:'潮風で石臼を回し、粉を挽く。',cost:130,inc:10,T:3,g:1.15},
  {id:'foundry',name:'鋳造所',desc:'炉に火が入り、鉄が型へ流れ込む。',cost:1500,inc:95,T:4,g:1.15},
  {id:'refinery',name:'精錬塔',desc:'煙突の先で余剰ガスが燃え続ける。',cost:20000,inc:1250,T:5,g:1.15},
  {id:'engine',name:'蒸気機関館',desc:'真鍮のドームの下で巨大な弾み車が回る。',cost:300000,inc:19000,T:6,g:1.15},
  {id:'core',name:'エーテル炉',desc:'島でいちばん明るい場所。理屈はだれも知らない。',cost:5e6,inc:330000,T:8,g:1.15},
  {id:'port',name:'天空港',desc:'荷運び機の母港。係留塔のまわりを飛行船が巡る。',cost:1e8,inc:7.5e6,T:10,g:1.15},
  {id:'clock',name:'星時計の塔',desc:'歯車の刻む時が、島全体の鼓動になる。',cost:3e9,inc:2.5e8,T:12,g:1.15},
  {id:'green',name:'硝子の大温室',desc:'硝子の天蓋の下で、一本の巨木が金色の実をつける。',cost:1e11,inc:9e9,T:14,g:1.15}
];
const BASEH=[.78,1.0,1.18,1.45,1.0,1.35,1.6,2.0,1.5];
const MS=[10,25,50,100,150,200,300,400,500];
const EXPAND_COST={3:6000,4:900000,5:1.5e8,6:3e10,7:1e13};
const LAND=[1,1,1,1.15,1.35,1.6,2.0,2.6];
const landMult=b=>LAND[Math.min(7,Math.max(Math.abs(b.gx),Math.abs(b.gy)))];
const REFORGE_MIN=5e6;

function defaultState(){return {coins:15,run:0,total:0,gears:0,rad:2,unl:0,b:[],buffT:0,taps:0,deliv:0,sound:true,music:true,mvol:2,low:false,rank:0,v:2,deco:true,tech:{},gp:0,ach:{},golds:0,reforges:0,t:Date.now()};}
let S=defaultState();
let achCount=0;
const DEPOT={gx:0,gy:0,pulse:0,lv:1,depot:true,name:'集荷塔',th:1.0,mult:1};
const TOWER_DEF=[
 {ring:3,gx:3,gy:-3,name:'灯台',th:1.5,mult:1.3},
 {ring:4,gx:-4,gy:4,name:'黄金の鐘楼',th:1.85,mult:1.7},
 {ring:5,gx:5,gy:5,name:'天文台',th:1.45,mult:2.3},
 {ring:6,gx:-6,gy:-6,name:'碑文のオベリスク',th:1.8,mult:3.2},
 {ring:7,gx:7,gy:-7,name:'星の渾天儀',th:1.7,mult:4.5}
].map(t=>Object.assign(t,{tower:true,depot:true,pulse:0,lv:1}));
const towerAt=(x,y)=>{for(const t of TOWER_DEF)if(t.gx===x&&t.gy===y&&t.ring<=S.rad)return t;return null;};
const activeObjs=()=>{const a=S.b.concat([DEPOT]);for(const t of TOWER_DEF)if(t.ring<=S.rad)a.push(t);return a;};
const objAt=(x,y)=>(x===0&&y===0)?DEPOT:(towerAt(x,y)||bAt(x,y));
let LOD=false;

const tierOf=lv=>{let n=0;for(const m of MS)if(lv>=m)n++;return n;};
const multOf=lv=>Math.pow(1.5+.05*techLv('ms'),tierOf(lv));
const techLv=id=>(S.tech&&S.tech[id])||0;
const gearMult=g=>1+.06*Math.pow(g,.9);
const gm=()=>gearMult(S.gears)*(S.buffT>0?3:1)*(1+.05*techLv('prod'))*(1+.02*achCount)*(1+.02*S.rank);
const costF=()=>Math.max(.5,1-.04*techLv('cost'));
const goldF=()=>1-.1*techLv('gold');
const START_COINS=[15,500,2e4,1e6,5e7,2e9];
const startCoins=()=>START_COINS[techLv('start')];
const tapAmt=()=>1+ips()*.03*(1+techLv('tap'));
const NB=[[1,0],[-1,0],[0,1],[0,-1]];
const CARD=NB,DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]];
const PAIR_DEF={'0-1':.20,'0-2':.15,'0-8':.18,'0-6':.12,'1-8':.30,'1-6':.20,'2-3':.25,'2-4':.20,'2-5':.15,'3-4':.25,'3-5':.20,'4-5':.25,'4-6':.15,'5-7':.35,'5-8':.30,'6-7':.30,'6-8':.25,'7-8':.22};
const pairV=(a,b)=>PAIR_DEF[Math.min(a,b)+'-'+Math.max(a,b)]||.08;
let layoutV=0,calcV=-1,GET=null;
const markLayout=()=>{layoutV++;};
function mkGet(){
  const m=new Map();for(const b of S.b)m.set(b.gx+','+b.gy,b);
  return (x,y)=>{if(x===0&&y===0)return DEPOT;const t=towerAt(x,y);if(t)return t;return m.get(x+','+y)||null;};
}
function adjCalc(type,gx,gy,get){
  let pr=0,same=0,tw=0,dg=0,occ=0,card=0;const kinds=new Set(),nbs=[];
  for(const d of CARD){const x=gx+d[0],y=gy+d[1],n=get(x,y);if(!n)continue;card++;occ++;let v;
    if(n.depot){v=.15;tw+=v;}else if(n.type===type){v=.04;same+=v;}else{v=pairV(type,n.type);pr+=v;kinds.add(n.type);}
    nbs.push({x:x,y:y,v:v,diag:false});}
  for(const d of DIAG){const x=gx+d[0],y=gy+d[1],n=get(x,y);if(!n)continue;occ++;let v;
    if(n.depot)v=.05;else if(n.type===type)v=.01;else v=pairV(type,n.type)/3;dg+=v;nbs.push({x:x,y:y,v:v,diag:true});}
  let sum=pr+same+tw+dg;const parts=[];
  if(pr)parts.push(['相性',pr]);if(same)parts.push(['同種',same]);if(tw)parts.push(['塔',tw]);if(dg)parts.push(['斜め',dg]);
  let four=false,full=false;
  if(card===4&&kinds.size===4){four=true;sum+=.3;parts.push(['四方の調和',.3]);}
  if(occ===8){full=true;sum+=.2;parts.push(['満員御礼',.2]);}
  let cl=1;const seen=new Set([gx+','+gy]),q=[[gx,gy]];
  while(q.length){const c=q.pop();for(const d of CARD){const x=c[0]+d[0],y=c[1]+d[1],k=x+','+y;if(seen.has(k))continue;const n=get(x,y);if(n&&!n.depot&&n.type===type){seen.add(k);cl++;q.push([x,y]);}}}
  if(cl>1){const v=Math.min(.5,.05*(cl-1));sum+=v;parts.push(['集落×'+cl,v]);}
  return {sum:sum,parts:parts,nbs:nbs,four:four,full:full,cluster:cl};
}
function ensureAdj(){
  if(calcV===layoutV)return;
  calcV=layoutV;GET=mkGet();
  for(const b of S.b)b._adj=adjCalc(b.type,b.gx,b.gy,GET);
}
function adjOf(b){ensureAdj();return 1+(b._adj?b._adj.sum:0)*(1+.5*techLv('adj'));}
function potRate(i,x,y){
  ensureAdj();const T=TYPES[i],a=adjCalc(i,x,y,GET),L=1+.5*techLv('adj');
  const adj=1+a.sum*L,land=LAND[Math.min(7,Math.max(Math.abs(x),Math.abs(y)))];
  return {rate:T.inc*gm()*adj*wxMult(i)*land/(T.T*(1-.03*techLv('speed'))),adj:adj,land:land};
}
function towerAdj(o){
  ensureAdj();let s=0;
  for(const d of CARD){const n=GET(o.gx+d[0],o.gy+d[1]);if(n&&!n.depot)s+=.10;}
  for(const d of DIAG){const n=GET(o.gx+d[0],o.gy+d[1]);if(n&&!n.depot)s+=.04;}
  return 1+s*(1+.5*techLv('adj'));
}
function tapOf(o){return tapAmt()*(o.mult||1)*(o.tower?(1+.25*techLv('tower')):1)*towerAdj(o);}
function relocate(){
  for(const b of S.b){
    if(!TOWER_DEF.some(t=>t.gx===b.gx&&t.gy===b.gy))continue;
    outer:for(let r=0;r<=S.rad;r++)for(let x=-r;x<=r;x++)for(let y=-r;y<=r;y++){
      if(Math.max(Math.abs(x),Math.abs(y))!==r||(x===0&&y===0))continue;
      if(bAt(x,y)||TOWER_DEF.some(t=>t.gx===x&&t.gy===y))continue;
      b.gx=x;b.gy=y;break outer;
    }
  }
}
const cyc=b=>TYPES[b.type].T*(1-.03*techLv('speed'));
const cycleAmt=b=>TYPES[b.type].inc*Math.pow(b.lv,.9)*multOf(b.lv)*gm()*adjOf(b)*wxMult(b.type)*landMult(b);
const rateOf=b=>cycleAmt(b)/cyc(b);
const ips=()=>{let a=0;for(const b of S.b)a+=rateOf(b);return a;};
const upCost=(b,n)=>{const T=TYPES[b.type],g=T.g;return T.cost*Math.pow(g,b.lv)*(Math.pow(g,n)-1)/(g-1)*costF();};
function maxBuy(b){
  const T=TYPES[b.type],g=T.g;const base=T.cost*Math.pow(g,b.lv)*costF();
  const n=Math.floor(Math.log(1+S.coins*(g-1)/base)/Math.log(g));
  return clamp(isFinite(n)?n:0,0,500);
}
const countOf=i=>S.b.filter(b=>b.type===i).length;
const placeCost=i=>TYPES[i].cost*Math.pow(1.5,countOf(i))*costF();
const bAt=(gx,gy)=>S.b.find(b=>b.gx===gx&&b.gy===gy);
const isLand=(gx,gy)=>Math.max(Math.abs(gx),Math.abs(gy))<=S.rad;
const reforgeGain=()=>S.run<REFORGE_MIN?0:Math.floor(Math.pow(Math.log10(S.run/REFORGE_MIN)+1,1.8));
function hk(b){const s=1+Math.min(b.lv,150)/150*.7;return s*(1+(b.pulse||0)*.1);}

/* ================= 描画ヘルパー ================= */
const px=(x,y,z)=>[(x-y)*TW/2,(x+y)*TH/2-(z||0)*ZU];
function poly(pts,fill,stroke,lw){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){if(i)ctx.lineTo(pts[i][0],pts[i][1]);else ctx.moveTo(pts[i][0],pts[i][1]);}
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}
function fillV(pts,c0,c1){
  let a=1e9,b=-1e9;for(const p of pts){if(p[1]<a)a=p[1];if(p[1]>b)b=p[1];}
  const g=ctx.createLinearGradient(0,a,0,b);g.addColorStop(0,c0);g.addColorStop(1,c1);poly(pts,g);
}
function box(cx,cy,w,d,z0,h,col,o){
  o=o||{};
  const x0=cx-w/2,x1=cx+w/2,y0=cy-d/2,y1=cy+d/2,z1=z0+h;
  const Lq=[px(x0,y1,z1),px(x1,y1,z1),px(x1,y1,z0),px(x0,y1,z0)];
  const Rq=[px(x1,y0,z1),px(x1,y1,z1),px(x1,y1,z0),px(x1,y0,z0)];
  const Tq=[px(x0,y0,z1),px(x1,y0,z1),px(x1,y1,z1),px(x0,y1,z1)];
  fillV(Lq,sh(col,.05),sh(col,-.17));
  fillV(Rq,sh(col,-.25),sh(col,-.42));
  if(!o.notop)poly(Tq,sh(col,.2));
  ctx.strokeStyle='rgba(255,246,220,.24)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(Lq[0][0],Lq[0][1]);ctx.lineTo(Lq[1][0],Lq[1][1]);ctx.lineTo(Rq[0][0],Rq[0][1]);ctx.stroke();
  ctx.strokeStyle='rgba(20,14,20,.16)';ctx.beginPath();ctx.moveTo(Lq[1][0],Lq[1][1]);ctx.lineTo(Lq[2][0],Lq[2][1]);ctx.stroke();
  return {
    x0:x0,x1:x1,y0:y0,y1:y1,z0:z0,z1:z1,w:w,d:d,h:h,
    L:(u,v)=>px(x0+u*w,y1,z0+v*h),
    R:(u,v)=>px(x1,y0+u*d,z0+v*h),
    T:(u,v)=>px(x0+u*w,y0+v*d,z1)
  };
}
function win(B,f,u0,v0,u1,v1,lit,arch){
  const q=[B[f](u0,v1),B[f](u1,v1),B[f](u1,v0),B[f](u0,v0)];
  if(lit)fillV(q,'#ffe3a2','#e49b3c');else fillV(q,'#7391a0','#2d414c');
  ctx.strokeStyle='rgba(30,22,16,.55)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);ctx.lineTo(q[1][0],q[1][1]);ctx.lineTo(q[2][0],q[2][1]);ctx.lineTo(q[3][0],q[3][1]);ctx.closePath();ctx.stroke();
  const m0=B[f]((u0+u1)/2,v1),m1=B[f]((u0+u1)/2,v0);
  ctx.beginPath();ctx.moveTo(m0[0],m0[1]);ctx.lineTo(m1[0],m1[1]);ctx.stroke();
}
function cyl(cx,cy,r,z0,h,col){
  const b=px(cx,cy,z0),t=px(cx,cy,z0+h);const rx=r*TW*.7071,ry=r*TH*.7071;
  const g=ctx.createLinearGradient(b[0]-rx,0,b[0]+rx,0);
  g.addColorStop(0,sh(col,.16));g.addColorStop(.42,sh(col,-.02));g.addColorStop(1,sh(col,-.42));
  ctx.fillStyle=g;ctx.beginPath();
  ctx.moveTo(b[0]-rx,t[1]);ctx.lineTo(b[0]-rx,b[1]);
  ctx.ellipse(b[0],b[1],rx,ry,0,Math.PI,0,true);
  ctx.lineTo(b[0]+rx,t[1]);
  ctx.ellipse(t[0],t[1],rx,ry,0,0,Math.PI,true);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=sh(col,.24);ctx.beginPath();ctx.ellipse(t[0],t[1],rx,ry,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(20,14,20,.18)';ctx.lineWidth=1;ctx.stroke();
  return {x:t[0],y:t[1],rx:rx,ry:ry,bx:b[0],by:b[1]};
}
function pyramid(cx,cy,w,d,z0,h,col){
  const x0=cx-w/2,x1=cx+w/2,y0=cy-d/2,y1=cy+d/2,a=px(cx,cy,z0+h);
  poly([px(x0,y1,z0),px(x1,y1,z0),a],sh(col,.08),'rgba(20,14,20,.15)',1);
  poly([px(x1,y0,z0),px(x1,y1,z0),a],sh(col,-.3),'rgba(20,14,20,.15)',1);
  return a;
}
function ground(cx,cy,r,z,fill,stroke,lw){
  poly([px(cx-r,cy-r,z),px(cx+r,cy-r,z),px(cx+r,cy+r,z),px(cx-r,cy+r,z)],fill,stroke,lw);
}
function glow(x,y,r,c0,a){
  ctx.save();ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c0.replace('A',a));g.addColorStop(1,c0.replace('A',0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
}

let AC=null,master=null,lastBlip=0,upStep=0,lastUp=0;
function audioInit(){
  try{
    if(AC){if(AC.state==='suspended')AC.resume();return;}
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);

}
function tone(f,d,type,v,delay,slide){
  if(!AC||!S.sound)return;
  const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.08,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
const PENT=[0,2,4,7,9];
const note=n=>261.63*Math.pow(2,(PENT[n%5]+12*Math.floor(n/5))/12);
const sfx={
  blip(){const n=performance.now();if(n-lastBlip<80)return;lastBlip=n;tone(rnd(1150,1500),.07,'sine',.022);},
  tap(){tone(420,.09,'triangle',.07,0,220);tone(1100,.05,'sine',.03,.01);},

  up(){const n=performance.now();if(n-lastUp>1400)upStep=0;lastUp=n;const k=Math.min(upStep++,12);tone(note(5+k),.22,'triangle',.085);tone(note(5+k)*2,.16,'sine',.03,.02);},
  milestone(){[5,7,9,12,14].forEach((k,i)=>tone(note(k),.4,'triangle',.08,i*.07));tone(110,.5,'sine',.14,0,60);},
  golden(){[12,14,16,19,21].forEach((k,i)=>tone(note(k),.5,'sine',.05,i*.06));},

const WXLIST=['clear','rain','storm','fog','rainbow'];
const WXS={cur:'clear',next:'rain',t:0,dur:rnd(70,110),vis:{rain:0,storm:0,fog:0,bow:0},lt:10,flash:0,bolt:null};
function wxMult(type){
  const w=WX[WXS.cur];let d=(w.m[type]||0)+(w.m.all||0);
  const L=techLv('wx');
  d=d>0?d*(1+.25*L):d*Math.max(0,1-.25*L);

}
function pickNext(cur){
  const tbl={clear:[['rain',.5],['fog',.3],['storm',.2]],rain:[['clear',.5],['storm',.3],['fog',.2]],storm:[['rain',.5],['clear',.5]],fog:[['clear',.6],['rain',.4]],rainbow:[['clear',1]]};
  const t=tbl[cur];let r=Math.random();for(const x of t){if((r-=x[1])<=0)return x[0];}return t[0][0];
}
function setWeather(id,quiet){
  WXS.cur=id;WXS.t=0;WXS.dur=id==='rainbow'?50:rnd(100,180);WXS.next=pickNext(id);WXS.lt=rnd(4,9);
  if(id==='rainbow'&&!GC.on){GC.on=true;GC.t=0;GC.dir=1;GC.y0=-200;GC.dur=15;}
  if(!quiet)toast('天気が「'+WX[id].n+'」に変わった:'+WX[id].d,4800);
}
function wxStep(dt){
  WXS.t+=dt;
  if(WXS.t>=WXS.dur){
    const prev=WXS.cur;let nx=WXS.next;
    if((prev==='rain'||prev==='storm')&&Math.random()<.5)nx='rainbow';
    setWeather(nx);

  const tg={rain:WXS.cur==='rain'?.6:WXS.cur==='storm'?1:0,storm:WXS.cur==='storm'?1:0,fog:WXS.cur==='fog'?1:0,bow:WXS.cur==='rainbow'?1:0};
  for(const k in tg)WXS.vis[k]+=(tg[k]-WXS.vis[k])*Math.min(1,dt*.7);
  if(WXS.flash>0)WXS.flash=Math.max(0,WXS.flash-dt*2.2);

}

  ctx.setLineDash([2,14]);ctx.lineDashOffset=-T*26;ring(R*1.62,R*.54,0,3,'rgba(255,255,255,.9)');ctx.setLineDash([]);

/* ================= BGM(自動演奏) ================= */
let MU=null;
const CHORDS=[{b:38,p:[50,57,60,64,65]},{b:34,p:[53,58,62,65,69]},{b:41,p:[53,57,60,64,69]},{b:36,p:[55,60,64,67,74]}];
const MSC=[62,64,65,67,69,72,74,76,77,79];
const mf=m=>440*Math.pow(2,(m-69)/12);
function mkImpulse(sec){const n=(AC.sampleRate*sec)|0,bf=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=bf.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6);}return bf;}
function voice(type,f,t,att,dur,rel,vol,dest,cut){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  let n=o;if(cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);n=fl;}
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setValueAtTime(vol,t+Math.max(att,dur));g.gain.exponentialRampToValueAtTime(.0001,t+dur+rel);
  n.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+rel+.05);
}
function nz(t,f,q,dur,vol,type,dest){
  const s=AC.createBufferSource();s.buffer=MU.nb;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(dest);s.loop=true;s.start(t,Math.random()*1.5,dur+.05);s.stop(t+dur+.1);
}
function kick(t){
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);
  g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(MU.out);o.start(t);o.stop(t+.3);
}
function musicStart(){
  if(!AC||MU||!S.music)return;
  const out=AC.createGain();out.gain.value=0;out.connect(master);
  const bus=AC.createGain();const dry=AC.createGain();dry.gain.value=.85;bus.connect(dry);dry.connect(out);
  const conv=AC.createConvolver();conv.buffer=mkImpulse(3);const wet=AC.createGain();wet.gain.value=.5;bus.connect(conv);conv.connect(wet);wet.connect(out);
  const dl=AC.createDelay(2);dl.delayTime.value=.536;const fb=AC.createGain();fb.gain.value=.34;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  const send=AC.createGain();send.gain.value=.55;send.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(bus);
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const rs=AC.createBufferSource();rs.buffer=nb;rs.loop=true;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800;const rg=AC.createGain();rg.gain.value=0;rs.connect(hp);hp.connect(rg);rg.connect(out);rs.start();
  const oc=AC.createBufferSource();oc.buffer=nb;oc.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.5;
  const og=AC.createGain();og.gain.value=0;oc.connect(bp);bp.connect(og);og.connect(out);oc.start();
  MU={out:out,bus:bus,send:send,nb:nb,og:og,rg:rg,I:0,i:0,mi:4,dt:60/84/2,next:AC.currentTime+.2};
  MU.timer=setInterval(musicTick,110);
  musicTick();
}
function musicStep(t,i){
  const I=MU.I,pos=i%16,ch=CHORDS[Math.floor(i/16)%4],dt=MU.dt;
  if(pos===0){
    for(const m of ch.p){voice('sawtooth',mf(m)*1.004,t,2,15*dt,3,.016,MU.bus,650+I*900);voice('triangle',mf(m)*.996,t,2.2,15*dt,3,.03,MU.bus,1400);}
    voice('sine',mf(ch.b),t,.05,6*dt,1.5,.22,MU.out);
  }
  if(pos===8)voice('sine',mf(ch.b),t,.05,3*dt,1.2,.16,MU.out);
  if(I>.35&&(pos===4||pos===12))voice('sine',mf(ch.b+12),t,.02,dt,.6,.07,MU.out);
  const p=.18+.38*I;
  if(Math.random()<(pos%2===0?p:p*.45)){
    MU.mi=clamp(MU.mi+((Math.random()*5)|0)-2,0,MSC.length-1);
    const f=mf(MSC[MU.mi]);
    voice('triangle',f,t,.006,.03,1.1,.07,MU.bus);voice('sine',f*2,t,.004,.02,.5,.025,MU.send);
  }
  if(I>.5&&Math.random()<.55){const m=ch.p[(Math.random()*ch.p.length)|0]+24;voice('sine',mf(m),t,.004,.02,.5,.02+.02*I,MU.send);}
  if(I>.12){nz(t,4500,3,.025,.016+.02*I,'highpass',MU.bus);if(pos%4===0)nz(t,1200,2,.04,.02,'bandpass',MU.bus);}
  if(I>.3&&pos%8===0)kick(t);
  if(I>.55&&(pos===4||pos===12))nz(t,1800,1,.14,.05,'bandpass',MU.bus);
  if(I>.7&&pos%4===2&&Math.random()<.5)voice('sine',mf(MSC[(Math.random()*MSC.length)|0]+24),t,.003,.02,1.4,.02,MU.send);
}
const MVOL=[0,.4,.7,1.1];
function musicTick(){
  if(!AC||!MU)return;
  const now=AC.currentTime;
  MU.out.gain.setTargetAtTime(S.music?MVOL[S.mvol]:0,now,.4);
  MU.rg.gain.setTargetAtTime(S.music?.07*(WXS.vis.rain+.4*WXS.vis.storm):0,now,1.2);
  if(!S.music||AC.state!=='running')return;
  const tgt=clamp((Math.log10(ips()+1)-1)/9,0,1);MU.I+=(tgt-MU.I)*.06;
  MU.og.gain.setTargetAtTime(.04+.03*Math.sin(now*.25),now,1);
  if(MU.next<now-.5)MU.next=now+.1;
  while(MU.next<now+.4){musicStep(MU.next,MU.i);MU.next+=MU.dt;MU.i++;}
}

/* ================= ゲーム進行 ================= */
let lastTick=Date.now(),achT=0,autoT=0,lastSig=-1;
function launch(b){
  const amt=cycleAmt(b);
  if(PARCELS.length>160){credit(amt,false);return;}
  const dist=Math.hypot(b.gx-.2,b.gy-.2);
  PARCELS.push({b:b,t:0,dur:1.0+dist*.13,amt:amt,gx:b.gx,gy:b.gy,z0:bh(b)*.92,ph:Math.random()*6});
}
function credit(amt,fx){
  S.coins+=amt;S.run+=amt;S.total+=amt;S.deliv++;
  if(fx){
    DEPOT.pulse=1;
    const t=depotTop();
    if(FL.length<18)addFloat(t[0]+rnd(-14,14),t[1]-10,'+'+fmt(amt,true));
    const p=px(.2,.2,.14);
    for(let i=0;i<3;i++)emit({kind:'conf',x:p[0],y:p[1],vx:rnd(-60,60),vy:rnd(-150,-70),g:380,life:rnd(.4,.8),size:rnd(2,3.5),col:'#f3cf72',rot:0,vr:rnd(-8,8)});
    sfx.blip();
  }
}
function step(dt){
  gt+=dt;
  ZU=lerp(ZU,S.low?32:72,Math.min(1,dt*7));
  if(S.buffT>0)S.buffT=Math.max(0,S.buffT-dt);
  wxStep(dt);decoStep(dt);
  achT+=dt;if(achT>.6){achT=0;checkAch();}
  const ai=[0,5,2,1][techLv('auto')];
  if(ai){autoT+=dt;if(autoT>=ai){autoT=0;const am=tapOf(DEPOT);credit(am,false);DEPOT.pulse=1;const t=depotTop();addFloat(t[0]+rnd(-12,12),t[1]-4,'+'+fmt(am,true));}}
  for(const b of S.b){
    const Tc=cyc(b);b.t+=dt;
    if(b.t>=Tc){b.t-=Tc;if(b.t>Tc)b.t=0;launch(b);}
    if(b.pulse>0)b.pulse=Math.max(0,b.pulse-dt*2.4);
    b.smk-=dt;
  }
  if(DEPOT.pulse>0)DEPOT.pulse=Math.max(0,DEPOT.pulse-dt*3);
  for(const t of TOWER_DEF)if(t.pulse>0)t.pulse=Math.max(0,t.pulse-dt*3);
  const sig=S.b.length*100+S.rad;if(sig!==lastSig){lastSig=sig;markLayout();}
  for(let i=PARCELS.length-1;i>=0;i--){
    const p=PARCELS[i];p.t+=dt;
    if(p.t>=p.dur){credit(p.amt,true);PARCELS.splice(i,1);}
  }
  while(S.unl<TYPES.length-1&&S.run>=TYPES[S.unl+1].cost*.4){S.unl++;toast('「'+TYPES[S.unl].name+'」が建てられるようになった');}
  if(expandT<1)expandT=Math.min(1,expandT+dt/1.3);
  camScale=lerp(camScale,targetScale(),Math.min(1,dt*3));
  if(shake>0)shake=Math.max(0,shake-dt*2.2);
  /* 粒子 */
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i];p.age+=dt;if(p.age>=p.life){PT.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.rot+=p.vr*dt;
  }
  for(let i=FL.length-1;i>=0;i--){FL[i].age+=dt;if(FL[i].age>=FL[i].life)FL.splice(i,1);}
  /* 金の荷 */
  if(!GC.on){GC.next-=dt;if(GC.next<=0){GC.on=true;GC.t=0;GC.dir=Math.random()<.5?1:-1;GC.y0=-rnd(120,300);GC.dur=rnd(15,19);}}
  else{GC.t+=dt;const p=GC.t/GC.dur;
    GC.x=lerp(-1000*GC.dir,1000*GC.dir,p);GC.y=GC.y0+Math.sin(p*9)*28;
    if(p>=1){GC.on=false;GC.next=rnd(55,100)*goldF();}}
}
const GC={on:false,x:0,y:0,t:0,dur:16,y0:-200,dir:1,next:28};

function applyOffline(sec){
  if(sec<20)return;
  const s=Math.min(sec,(8+2*techLv('offcap'))*3600);
  const gain=ips()*s*(.5+.1*techLv('off'));

function candidates(sx,sy){
  const w=toWorld(sx,sy),wx=w[0],wy=w[1],out=[];
  const all=activeObjs().sort((a,b)=>(b.gx+b.gy)-(a.gx+a.gy));
  for(const b of all){
    const c=px(b.gx,b.gy,0);
    if(Math.abs(wx-c[0])<TW*.3&&wy>c[1]-(bh(b)+.2)*ZU-10&&wy<c[1]+TH*.28)out.push({gx:b.gx,gy:b.gy});
  }
  const u=wx/(TW/2),v=wy/(TH/2);
  const gx=Math.round((u+v)/2),gy=Math.round((v-u)/2);
  if(Math.abs(gx)<=MAXR&&Math.abs(gy)<=MAXR&&!out.some(o=>o.gx===gx&&o.gy===gy))out.push({gx:gx,gy:gy});
  return out;
}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const q=localXY(e);
  ptrs.set(e.pointerId,{x:q[0],y:q[1]});
  if(ptrs.size===1)drag={moved:0};
  else if(ptrs.size===2){const a=[...ptrs.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),z:userZoom};if(drag)drag.moved=99;}
});
cv.addEventListener('pointermove',e=>{
  const q=localXY(e);const p=ptrs.get(e.pointerId);
  if(!p){if(e.pointerType==='mouse'){const k=pick(q[0],q[1]);hover=k&&k.kind==='tile'&&isLand(k.gx,k.gy)?k:null;cv.classList.toggle('pointer',!!k&&(k.kind==='gold'||(k.kind==='tile'&&isLand(k.gx,k.gy))));}return;}
  const dx=q[0]-p.x,dy=q[1]-p.y;p.x=q[0];p.y=q[1];
  if(ptrs.size===2&&pinch){const a=[...ptrs.values()];userZoom=clamp(pinch.z*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/pinch.d,.6,2.4);return;}
  if(drag){drag.moved+=Math.abs(dx)+Math.abs(dy);if(drag.moved>8){panX=clamp(panX+dx,-520,520);panY=clamp(panY+dy,-360,360);}}
});
function endPtr(e,cancel){
  const q=localXY(e);const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(!had)return;
  if(ptrs.size===0){if(drag&&drag.moved<=8&&!cancel)clickAt(q[0],q[1]);drag=null;pinch=null;}
  else if(ptrs.size<2)pinch=null;
}
cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('pointerleave',()=>{hover=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();userZoom=clamp(userZoom*Math.exp(-e.deltaY*.0012),.6,2.4);},{passive:false});

function drawWaves(){
  ctx.lineCap='round';

}

  cyl(cx,cy,.255,z,.05,'#3a3f44');z+=.05;
  const lc=px(cx,cy,z+.1);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const a=gt*1.1;
  for(let s=0;s<2;s++){
    const ang=a+s*Math.PI,dx=Math.cos(ang)*340,dy=Math.sin(ang)*170,nx=-Math.sin(ang)*34,ny=Math.cos(ang)*17;

  }

  glow(lc[0],lc[1],50,'rgba(255,225,140,A)',.55+.3*Math.sin(gt*5));
  poly([[lt.x-lt.rx-3,lt.y],[lt.x,lt.y-26],[lt.x+lt.rx+3,lt.y]],'#c4472f','rgba(40,16,10,.4)',1);
}
function tBell(o){

function drawParcel(p){
  const t=p.t/p.dur,e=t*t*(3-2*t);

  const x=lerp(p.gx,tx,e),y=lerp(p.gy,ty,e);
  const peak=.55+Math.hypot(p.gx,p.gy)*.06;

  const g=px(x,y,0);
  ctx.fillStyle='rgba(18,36,30,.18)';ctx.beginPath();ctx.ellipse(g[0]+4,g[1],7*(1-z*.2),3.2,0,0,Math.PI*2);ctx.fill();

/* --- 粒子・フロート --- */
function drawParticles(){
  for(const p of PT){
    const t=p.age/p.life;
    if(p.kind==='smoke'){
      ctx.globalAlpha=(1-t)*(1-t)*.42;ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1+t*2.6),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    }else if(p.kind==='spark'){
      glow(p.x,p.y,p.size*4.5,p.col,(1-t));
      ctx.globalAlpha=1-t;ctx.fillStyle='#fff3cf';ctx.fillRect(p.x-1,p.y-1,2,2);ctx.globalAlpha=1;
    }else if(p.kind==='conf'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,(1-t)*2);
      ctx.fillStyle=p.col;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();ctx.globalAlpha=1;
    }else if(p.kind==='ring'){
      const e=1-Math.pow(1-t,3),r=lerp(p.size,p.max,e);
      ctx.globalAlpha=(1-t)*.9;ctx.strokeStyle=p.col;ctx.lineWidth=4*(1-t)+1;
      ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.5,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    }
  }
}
function drawFloats(){
  ctx.textAlign='center';ctx.lineJoin='round';
  for(const f of FL){
    const t=f.age/f.life,e=1-Math.pow(1-Math.min(1,t*1.6),3);
    const y=f.y-e*(f.big?70:46),a=t<.7?1:1-(t-.7)/.3;
    ctx.globalAlpha=Math.max(0,a);
    ctx.font='800 '+(f.big?34:24)+'px "Shippori Mincho B1","Hiragino Mincho ProN",serif';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(44,28,6,.7)';ctx.strokeText(f.text,f.x,y);
    ctx.fillStyle=f.big?'#ffe08a':'#fff6d8';ctx.fillText(f.text,f.x,y);
  }
  ctx.globalAlpha=1;
}

function covers(b,tx,ty){
  if(b.gx===tx&&b.gy===ty)return false;
  if(b.gx+b.gy<=tx+ty)return false;
  const cb=px(b.gx,b.gy,0),ce=px(tx,ty,0);
  return Math.abs(cb[0]-ce[0])<TW*.62&&(cb[1]-(bh(b)+.05)*ZU)<ce[1]+TH*.25;
}
function rr(x,y,w,hh,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+hh,r);ctx.arcTo(x+w,y+hh,x,y+hh,r);ctx.arcTo(x,y+hh,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function tag(gx,gy,fs,strong){

  ctx.font='700 '+(fs*.82)+'px "Zen Kaku Gothic New",sans-serif';
  const w2=l2?ctx.measureText(l2).width:0;

  ctx.lineWidth=strong?2:1;ctx.strokeStyle=strong?'#f0c56a':'rgba(236,242,239,.4)';ctx.stroke();

function plotTop(gx,gy,strong){
  const q=[px(gx-.42,gy-.42,0),px(gx+.42,gy-.42,0),px(gx+.42,gy+.42,0),px(gx-.42,gy+.42,0)];
  ctx.setLineDash([8,6]);poly(q,strong?'rgba(246,208,102,.16)':'rgba(255,250,225,.1)',strong?'rgba(246,208,102,.95)':'rgba(255,250,225,.75)',2.4);ctx.setLineDash([]);
  if(!strong){const c=px(gx,gy,0);ctx.strokeStyle='rgba(255,250,225,.8)';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(c[0]-8,c[1]);ctx.lineTo(c[0]+8,c[1]);ctx.moveTo(c[0],c[1]-4);ctx.lineTo(c[0],c[1]+4);ctx.stroke();}
}

/* ================= メイン描画 ================= */
function render(){
  const c=cam();
  drawWater(c);
  const sx=shake>0?(Math.random()-.5)*shake*14:0,sy=shake>0?(Math.random()-.5)*shake*14:0;
  ctx.setTransform(DPR*c.s,0,0,DPR*c.s,DPR*(c.ox+sx),DPR*(c.oy+sy));
  drawWaves();
  const R=S.rad;
  decoGear();
  for(let gx=-MAXR;gx<=MAXR;gx++)for(let gy=-MAXR;gy<=MAXR;gy++)if(!isLand(gx,gy))shallowTile(gx,gy);
  decoWater();
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    const ringed=Math.max(Math.abs(gx),Math.abs(gy))===R&&expandT<1;
    const e=1-Math.pow(1-expandT,3);
    const zo=ringed?-(1-e)*.9:0;
    if(ringed)ctx.globalAlpha=Math.max(.02,e);
    landTile(gx,gy,zo);
    ctx.globalAlpha=1;
  }
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    if(gx===0&&gy===0)continue;
    if(!objAt(gx,gy))plotMark(gx,gy);
  }
  if(hover&&isLand(hover.gx,hover.gy))highlight(hover.gx,hover.gy,'hover');
  if(sel)highlight(sel.gx,sel.gy,'sel');
  if(S.b.length===0&&!sel){
    const a=.5+.5*Math.sin(gt*3.2);
    poly([px(.5,-.5,0),px(1.5,-.5,0),px(1.5,.5,0),px(.5,.5,0)],'rgba(255,240,190,'+(.1+.16*a).toFixed(2)+')','rgba(246,208,102,'+(.5+.4*a).toFixed(2)+')',3);
  }
  for(const o of activeObjs())shadowOf(o);
  const objs=activeObjs();
  const cov=new Set();
  for(const o of objs){const rg=Math.ceil(bh(o)+1)+1;for(let a=0;a<=rg;a++)for(let b=0;b<=rg;b++){if(!a&&!b)continue;if(covers(o,o.gx-a,o.gy-b))cov.add((o.gx-a)+','+(o.gy-b));}}
  LOD=S.b.length>70&&c.s<.55;
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    const o=objAt(gx,gy);if(!o)continue;
    const cp=px(gx,gy,0),sxp=c.ox+cp[0]*c.s,syp=c.oy+cp[1]*c.s;
    if(sxp<-200*c.s-50||sxp>W+200*c.s+50||syp<-80||syp-480*c.s>H)continue;
    const tg=sel&&covers(o,sel.gx,sel.gy)?.24:1;
    o.fa=lerp(o.fa==null?1:o.fa,tg,.22);
    let al=o.fa;if(o.tower&&o.ring===S.rad&&expandT<1)al*=1-Math.pow(1-expandT,3);
    ctx.globalAlpha=al;drawObject(o);ctx.globalAlpha=1;
  }
  for(const p of PARCELS)drawParcel(p);
  decoRim();decoSky();
  /* 最前面:隠れた区画の目印・選択表示・レベル札 */
  const fs=clamp(12/c.s,12,30);
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    if(gx===0&&gy===0)continue;
    const isSel=sel&&sel.gx===gx&&sel.gy===gy,covd=cov.has(gx+','+gy),o=objAt(gx,gy);
    if(!o){if(covd)plotTop(gx,gy,isSel);}
    else if(isSel&&covd)plotTop(gx,gy,true);
  }
  if(sel){
    ensureAdj();
    const sb=selB();
    if(sb&&!sb.depot&&sb._adj){
      const c0=px(sb.gx,sb.gy,0),AL=1+.5*techLv('adj');
      for(const nb of sb._adj.nbs){
        const c1=px(nb.x,nb.y,0);
        ctx.setLineDash([6,5]);ctx.strokeStyle=nb.diag?'rgba(246,208,102,.6)':'rgba(246,208,102,.95)';ctx.lineWidth=nb.diag?1.6:2.8;
        ctx.beginPath();ctx.moveTo(c0[0],c0[1]);ctx.lineTo(c1[0],c1[1]);ctx.stroke();ctx.setLineDash([]);
        const val=nb.v*AL;if(val<.045)continue;
        const mx=(c0[0]+c1[0])/2,my=(c0[1]+c1[1])/2,t='+'+Math.round(val*100)+'%',f2=fs*.85;
        ctx.font='800 '+f2+'px "Zen Kaku Gothic New",sans-serif';const w=ctx.measureText(t).width+f2;
        rr(mx-w/2,my-f2*.8,w,f2*1.6,f2*.8);ctx.fillStyle='rgba(14,30,37,.92)';ctx.fill();ctx.strokeStyle='#f0c56a';ctx.lineWidth=1.4;ctx.stroke();
        ctx.fillStyle='#f6dc92';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,mx,my+.5);ctx.textBaseline='alphabetic';
      }
    }
  }
  if(S.b.length<=40||c.s>=.75)for(const b of S.b)badge(b,fs);
  if(hover&&!(sel&&hover.gx===sel.gx&&hover.gy===sel.gy)&&isLand(hover.gx,hover.gy))tag(hover.gx,hover.gy,fs,false);
  if(sel)tag(sel.gx,sel.gy,fs*1.08,true);
  drawClouds();
  drawWxWorld();
  drawParticles();
  drawGold();
  drawFloats();
  /* ビネット */
  drawDecoScreen();
  drawWxScreen();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const v=ctx.createRadialGradient(W/2,H*.48,Math.min(W,H)*.35,W/2,H*.48,Math.max(W,H)*.8);
  v.addColorStop(0,'rgba(6,18,24,0)');v.addColorStop(1,'rgba(6,18,24,.42)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

/* ================= ループ ================= */
let last=0,saveT=0,started=false;
function frame(now){
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=.016;dt=Math.min(dt,.1);
  if(started){
    for(let i=0;i<speed;i++)step(dt);updateHud(dt);
    saveT+=dt;if(saveT>5){saveT=0;save();}
  }
  render();
  lastTick=Date.now();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();if(AC&&AC.suspend)AC.suspend();return;}
  if(AC&&AC.resume)AC.resume();
  if(!started)return;
  const away=(Date.now()-lastTick)/1000;
  if(away>15){applyOffline(away);}
});
window.addEventListener('beforeunload',()=>{if(!wiping&&started)save();});

/* ================= 起動 ================= */
function begin(fresh){
  audioInit();
  let away=0;
  if(!fresh){const d=load();if(d){applySave(d);away=(Date.now()-(d.t||Date.now()))/1000;}}
  else{try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=defaultState();}
  achCount=Object.keys(S.ach||{}).length;
  setWeather('clear',true);markLayout();
  started=true;if(S.music)musicStart();dispCoins=S.coins;camScale=targetScale()*.9;
  $('#splash').classList.add('out');
  sel=null;renderStruct();
  if(S.b.length===0)toast('光っている区画をタップして、最初の工房を建てよう',4200);
  setTimeout(()=>{if(away>20)applyOffline(away);},900);
}
$('#btnStart').addEventListener('click',()=>begin(false));
$('#btnFresh').addEventListener('click',()=>begin(true));
if(hasSave())$('#btnFresh').classList.remove('hidden');
resize();camScale=targetScale();renderStruct();
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
